# Pan 2017 Grade 1–5 分档（与虹膜颜色深浅独立，均可单独标定）
grade:
  # L* 四个递减上界 → Grade 1–5；恰在边界取较深档
  boundaries: [55, 45, 29, 19]

# 虹膜颜色：色相（a*/b*）+ 深浅（L* 三档）
color_classification:
  # 色相判定阈值
  hue:
    blue_b_max: -8.0       # b* 低于此值视为蓝色系
    blue_a_max: 12.0       # 蓝色系时 a* 上限（排除偏红）
    green_a_max: -3.0      # a* 低于此值视为绿色系
    green_b_min: -5.0      # 绿色系 b* 下限
    green_b_max: 35.0      # 绿色系 b* 上限
  # 深浅分档（与 grade 独立）
  depth:
    # 两个递减上界 → 浅 / 中 / 深
    # 浅: L* > b1；中: b2 < L* <= b1；深: L* <= b2；恰在边界取较深档
    boundaries: [45, 19]

# 定位模式: eye_closeup（默认，眼部特写）| face（全脸）| auto（先特写后全脸）
detection:
  mode: eye_closeup


# 眼部特写：瞳孔 → 虹膜环带（相对瞳孔半径的倍数）
eye_closeup:
  center_roi_ratio: 0.85
  pupil_dark_percentile: 12.0
  inner_pupil_multiplier: 1.15
  outer_pupil_multiplier: 2.8
  inner_iris_ratio: 0.35
  outer_iris_ratio: 0.85

  # 性能：定位统一降采样到此最短边（<=此值的图不缩放，结果会缩放回全分辨率）
  # 圆形 FOV 裁剪后虹膜已占满视野，800 足够
  detect_target_min_dim: 800
  # 性能：CIELAB 取色的有效像素上限，超过则固定种子随机抽样（中位数稳健）；0=不限
  color_sample_cap: 20000

  # 圆形光圈黑边裁剪：实拍特写四角纯黑，先裁再定位，提升半径比例准确性并省算力
  circular_fov:
    enabled: true
    luminance_threshold: 12
    min_coverage: 0.15
    max_coverage: 0.70
    margin_ratio: 0.02

  # 上睑遮挡：取色时剔除上扇区，减轻眼皮/睫毛污染 Lab
  occlusion:
    exclude_upper_deg: 60   # 相对正上方左右各半角；0=关闭

  # 未做 FOV 裁剪时：blur 低于此值则 auto 强制放宽 disk（清晰小图通常远高于此）
  soft_blur_threshold: 20.0

  # 眼部先验（MediaPipe FaceLandmarker）：特写圆光圈图通常无完整人脸，默认关闭以省算力。
  # 全脸/眉毛误检场景可改回 true。
  use_landmark_prior: false
  landmark_roi_margin: 3.0
  eyebrow_suspect_sclera_min: 0.06
  # 全帧中心偏离先验虹膜中心超过此倍数虹膜半径时，判定疑似锁在眉毛/睫毛上并触发 ROI 抢救
  prior_disagree_factor: 1.0

  # 自动切换：精定位瞳孔置信度低于此值时回退黑盘直检
  auto_precise_min_confidence: 0.5
  # 深色融合眼无法分出瞳孔时，按虹膜半径比例估算瞳孔
  pupil_iris_ratio: 0.30

  # 镜面反光修复（瞳孔亮环、屏幕/窗户反光）
  specular:
    enabled: true
    v_threshold: 230      # 亮度高于此值视为高光候选
    sat_threshold: 90     # 且饱和度低于此值才算镜面反光
    max_area_ratio: 0.08  # 相对裁剪后画幅；覆盖窗格大块反光
    dilate_px: 3
    # when_present: 仅当检出反光 mask 时跳过污染射线；true/false 强制开/关
    skip_rays: when_present

  # 黑盘直检（实拍粗略模式核心）
  disk:
    dark_percentile: 35.0
    min_radius_ratio: 0.10
    max_radius_ratio: 0.48      # FOV 裁剪后虹膜占画幅更大；过高会让 Hough 严阈值短路漏检
    circularity_min: 0.55
    surround_contrast: 22.0     # 外侧(巩膜)需比盘内(虹膜)平均亮多少；区分虹膜与眉毛的关键
    surround_support_min: 0.45  # 满足反差的角度比例下限
    sclera_min: 0.10            # 偏白巩膜占比（仅作加分项，不再硬门槛）
    sclera_v_min: 150.0         # 巩膜判定：亮度高于此值
    sclera_s_max: 60.0          # 巩膜判定：饱和度低于此值
    sclera_bilateral_min: 0.0   # 双侧巩膜硬门槛（左右各须达标）；0=关闭，仅作加分以免误杀深色融合眼
    target_min_dim: 700         # 黑盘直检内部 Hough 的工作分辨率
    inner_iris_ratio: 0.40      # 环带内缘（扣掉瞳孔）
    outer_iris_ratio: 0.85      # 环带外缘（留在虹膜中段）

# 全脸模式环带比例（相对 iris landmark 半径，仅 mode=face/auto 时使用）
iris_ring:
  inner_ratio: 0.30
  outer_ratio: 0.80

quality:
  blur_threshold: 15.0
  overexposed_ratio_max: 0.15
  min_sample_pixels: 50

highlight_v_threshold: 240

# 调试后门（不对接 iris-web 前端）
debug:
  enabled: true
  api_key: iris-color-dev
  save_to_disk: false
  output_dir: debug_output
