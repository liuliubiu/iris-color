# Pan 2017 Grade 1–5 分档（与虹膜颜色深浅独立，均可单独标定）
grade:
  # L* 四个递减上界 → Grade 1–5；恰在边界取较深档
  boundaries: [55, 45, 29, 19]

# 虹膜颜色：色相（a*/b*）+ 深浅（L* 三档）
color_classification:
  # 色相判定阈值
  hue:
    blue_b_max: -8.0       # b* 低于此值视为蓝色系
    blue_a_max: 12.0       # 蓝色系时 a* 上限（排除偏红）
    green_a_max: -3.0      # a* 低于此值视为绿色系
    green_b_min: -5.0      # 绿色系 b* 下限
    green_b_max: 35.0      # 绿色系 b* 上限
  # 深浅分档（与 grade 独立）
  depth:
    # 两个递减上界 → 浅 / 中 / 深
    # 浅: L* > b1；中: b2 < L* <= b1；深: L* <= b2；恰在边界取较深档
    boundaries: [45, 19]

# 巩膜参考色彩归一化：以巩膜（眼白）为图内参考做 von Kries 对角增益校正，
# 吸收不同手机白平衡/对焦/照度导致的整图色偏与曝光偏移（提升同人跨条件一致性）。
# 巩膜采样失败（过曝/像素不足）时自动回退原始取色，不影响主流程。
sclera_normalization:
  enabled: true
  algorithm_version: adaptive-v3-device-profile
  # ---- 采样几何：虹膜外径的倍数环带，只取左右楔形（上下是眼皮/睫毛）----
  ring_inner_scale: 1.10
  ring_outer_scale: 1.60
  wedge_half_angle_deg: 55.0
  scope_max_ratio: 0.92      # 收缩到视场半径的比例内，避开视场边缘渐晕
  # ---- 像素过滤 ----
  v_min: 100.0               # 亮度下限（剔除睫毛/阴影）
  s_max: 70.0                # 饱和度上限（剔除皮肤）
  rg_diff_max: 30.0          # R-G 差上限（剔除血管等偏红像素）
  clip_v: 250.0              # 任一通道达到此值视为削波，剔除且计入 clipped_ratio
  clipped_ratio_max: 0.50    # 削波占比超过此值视为巩膜过曝，参考不可用
  min_pixels: 500            # 有效巩膜像素下限
  sample_cap: 50000          # 中值统计抽样上限（固定种子）
  side_v_gap: 25.0           # 左右楔形亮度中位数差超过此值时只用更亮一侧
                             # （裂隙灯窄光束下单侧巩膜常在阴影里）；0=关闭
  bright_percentile: 75.0    # 只保留 V 高于此分位数的巩膜像素：被照亮的巩膜才
                             # 与虹膜受到的照明对应，阴影里的巩膜会引入增益噪声；0=关闭
  mad_trim: 2.5              # 按 V 中位数 ± N×MAD 修剪残余阴影/亮斑；0=关闭
  # ---- 校正目标 ----
  target_l: 88.0             # 保留作离线实验参数；当前生产配置不做亮度拉伸
  normalize_luminance: false # 当前实验记录显示巩膜亮度归一会放大同人 L* 离散度
  normalize_chroma: true     # 归一色偏（稳定蓝/绿/棕分类）
  luminance_strength: 0.0
  chroma_strength: 0.6       # 提高可见色偏校正；下项保证其不改变虹膜线性亮度
  preserve_iris_luminance_during_chroma: true
  luminance_log_deadband: 0.05
  chroma_log_deadband: 0.0
  # ---- 参考可靠性与自适应收缩 ----
  adaptive_strength: true
  quality_min_apply: 0.10    # 低于此质量分直接回退原始取色
  quality_strength_floor: 0.05
  quality_strength_power: 1.0
  quality_pixel_full_factor: 2.0
  quality_min_side_pixels: 250
  quality_missing_side_gap: 0.22
  quality_clip_bad: 0.50
  quality_side_gap_bad: 0.40
  quality_mad_ratio_bad: 0.30
  max_gain_ratio: 1.12       # 对数域对称限幅：[1/1.12, 1.12]
  # ---- 设备级巩膜亮度标定 ----
  # 两台设备的“巩膜 L* → 虹膜 L*”关系方向相反，不能再共用同一个亮度增益。
  # 原图尺寸用于匹配当前实验设备；未知尺寸不做亮度移动，仅保留上面的色偏校正。
  device_luminance_profiles:
    enabled: true
    quality_min_apply: 0.10
    quality_power: 1.0
    delta_lstar_max: 1.0
    profiles:
      honor70:
        dimensions: [[1440, 1920], [3072, 4096]]
        sclera_target_l: 93.51
        iris_l_per_sclera_l: 0.35
        iris_lstar_offset: -1.0
      iphone15plus:
        dimensions: [[4284, 5712]]
        sclera_target_l: 91.87
        iris_l_per_sclera_l: -0.30
        iris_lstar_offset: 0.10
  lum_gain_min: 0.5          # 亮度增益截断范围（防止极端巩膜值导致过度提亮/压暗）
  lum_gain_max: 2.0
  gain_min: 0.25             # 增益超出此区间视为参考不可靠，放弃校正
  gain_max: 4.0
  # ---- 瞳孔黑参考（仿射模型，可选）----
  # 瞳孔本应接近纯黑；实测偏亮部分 ≈ 对焦不实/镜头炫光的加性雾。
  # 开启后先扣掉该偏置再做增益：corrected = (pixel - offset) x gain
  use_pupil_black: false
  pupil_radius_scale: 0.7    # 取瞳孔半径×此比例的内圈（避开边缘过渡带）
  pupil_black_percentile: 25.0  # 取线性 RGB 低分位数（避开瞳孔内反光亮斑）
  pupil_min_pixels: 50

# 眼部特写（镜筒图）：瞳孔 → 虹膜环带定位与取色
eye_closeup:
  # ---- 阶段A 精定位（清晰小图；瞳孔与虹膜可分离时用）----
  center_roi_ratio: 0.85
  pupil_dark_percentile: 12.0
  inner_pupil_multiplier: 1.15
  outer_pupil_multiplier: 2.8
  inner_iris_ratio: 0.35
  outer_iris_ratio: 0.85
  # 自动切换：精定位瞳孔置信度低于此值时回退黑盘直检
  auto_precise_min_confidence: 0.5
  # 深色融合眼无法分出瞳孔时，按虹膜半径比例估算瞳孔
  pupil_iris_ratio: 0.30

  # ---- 性能 ----
  # 整条流水线（质量/定位/取色/调试图）工作分辨率上限（最短边）；0=不限
  process_max_dim: 1600
  # 定位阶段进一步降采样的最短边（<=此值不缩放，结果缩放回工作分辨率）
  detect_target_min_dim: 700
  # CIELAB 取色的有效像素上限，超过则固定种子随机抽样（中位数稳健）；0=不限
  color_sample_cap: 20000
  # 取色鲁棒修剪：Lab 转换后按 L* 中位数 ± N×MAD 剔除离群（睫毛/残余高光）；0=关闭
  color_trim_mad: 2.5

  # ---- 镜筒视场（黑边框+亮圆）：裁黑边 + 作为虹膜尺度/位置先验 ----
  scope_field:
    enabled: true
    v_threshold: 12            # 亮区判定阈值（V 通道），纯黑镜筒边框远低于此
    skip_if_bright_ratio: 0.90 # 亮区占比超过此值视为普通图，不裁剪
    min_fill_ratio: 0.55       # 亮区须基本填满外接圆，否则不视为镜筒图
    min_radius_ratio: 0.25     # 视场圆半径下限（相对小图最短边）
    margin_ratio: 0.02         # 裁剪外接框边距（相对视场半径）
    # 【最关键的定位参数】虹膜半径相对视场半径的允许区间。
    # 旧批次 ~0.47~0.58；0716 手机紧裁批次在自适应视场下 ~0.46~0.64。
    # 换不同镜筒/放大倍率时需重新标定（scripts/_diag_ratios.py）。
    iris_r_min_ratio: 0.42
    iris_r_max_ratio: 0.68
    # 角膜缘外扩系数：Daugman 响应峰略偏边缘内侧，×此值贴合可见虹膜外缘
    limbus_edge_scale: 1.06

  # ---- 环带扇区遮挡剔除：砍掉眼皮/睫毛/反光楔形区 ----
  ring_sectors:
    enabled: true
    count: 36                  # 扇区数
    v_dev_max: 45.0            # 扇区亮度中位数偏离全环中位数超过此值即剔除
    min_keep_ratio: 0.40       # 保留扇区占比低于此值视为过滤失败，回退原环带

  # ---- 镜面反光修复（瞳孔亮环、屏幕/窗户反光）----
  specular:
    enabled: true
    v_threshold: 230      # 亮度高于此值视为高光候选
    sat_threshold: 90     # 且饱和度低于此值才算镜面反光
    max_area_ratio: 0.04  # 单个亮斑面积占比上限，超过视为巩膜/皮肤不修复
    dilate_px: 3
    skip_rays: false      # 径向剖面是否跳过反光像素；默认关闭

  # ---- 黑盘直检（镜筒实拍核心；射线拟合为主，Hough 为兜底）----
  disk:
    dark_percentile: 35.0
    min_radius_ratio: 0.10      # 无视场先验时的 Hough 半径下限（相对最短边）
    max_radius_ratio: 0.50      # 无视场先验时的 Hough 半径上限
    circularity_min: 0.55
    surround_contrast: 6.0      # 虹膜到巩膜的平均亮度差下限（有雾化/反光时勿设过高）
    surround_support_min: 0.45  # 满足反差的角度比例下限
    sclera_v_min: 150.0         # 巩膜判定：亮度高于此值
    sclera_s_max: 60.0          # 巩膜判定：饱和度低于此值
    target_min_dim: 700         # 黑盘直检内部工作分辨率
    inner_iris_ratio: 0.40      # 环带内缘（扣掉瞳孔）
    outer_iris_ratio: 0.85      # 环带外缘（留在虹膜中段）

quality:
  # 镜筒特写只统计视场圆内（实测镜筒图 blur 分布 24~142，均高于此阈值）
  blur_threshold: 15.0
  overexposed_ratio_max: 0.15
  min_sample_pixels: 50

highlight_v_threshold: 240

# 调试后门（不对接 iris-web 前端）
debug:
  enabled: true
  api_key: iris-color-dev
  save_to_disk: false
  output_dir: debug_output

# 实验记录（本地开发用，云端保持 enabled: false）
experiments:
  enabled: true
  api_key: iris-color-dev
  backend: mysql
  db_path: data/experiment_records.db
  # 调色对比快照目录（相对 iris-vision/）：before.jpg、after.jpg、compare_audit.json
  snapshot_dir: data/experiment_snapshots
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: "zxcvbnm"              # 填写本地 MySQL 密码，或设置环境变量 EXPERIMENT_MYSQL_PASSWORD
    database: iris_experiment
    charset: utf8mb4
