# Pan 2017 Grade 1–5 分档（与虹膜颜色深浅独立，均可单独标定）
grade:
  # L* 四个递减上界 → Grade 1–5；恰在边界取较深档
  boundaries: [55, 45, 29, 19]

# 虹膜颜色：色相（a*/b*）+ 深浅（L* 三档）
color_classification:
  # 色相判定阈值
  hue:
    blue_b_max: -8.0       # b* 低于此值视为蓝色系
    blue_a_max: 12.0       # 蓝色系时 a* 上限（排除偏红）
    green_a_max: -3.0      # a* 低于此值视为绿色系
    green_b_min: -5.0      # 绿色系 b* 下限
    green_b_max: 35.0      # 绿色系 b* 上限
  # 深浅分档（与 grade 独立）
  depth:
    # 两个递减上界 → 浅 / 中 / 深
    # 浅: L* > b1；中: b2 < L* <= b1；深: L* <= b2；恰在边界取较深档
    boundaries: [45, 19]

# 眼部特写（镜筒图）：瞳孔 → 虹膜环带定位与取色
eye_closeup:
  # ---- 阶段A 精定位（清晰小图；瞳孔与虹膜可分离时用）----
  center_roi_ratio: 0.85
  pupil_dark_percentile: 12.0
  inner_pupil_multiplier: 1.15
  outer_pupil_multiplier: 2.8
  inner_iris_ratio: 0.35
  outer_iris_ratio: 0.85
  # 自动切换：精定位瞳孔置信度低于此值时回退黑盘直检
  auto_precise_min_confidence: 0.5
  # 深色融合眼无法分出瞳孔时，按虹膜半径比例估算瞳孔
  pupil_iris_ratio: 0.30

  # ---- 性能 ----
  # 整条流水线（质量/定位/取色/调试图）工作分辨率上限（最短边）；0=不限
  process_max_dim: 1600
  # 定位阶段进一步降采样的最短边（<=此值不缩放，结果缩放回工作分辨率）
  detect_target_min_dim: 700
  # CIELAB 取色的有效像素上限，超过则固定种子随机抽样（中位数稳健）；0=不限
  color_sample_cap: 20000
  # 取色鲁棒修剪：Lab 转换后按 L* 中位数 ± N×MAD 剔除离群（睫毛/残余高光）；0=关闭
  color_trim_mad: 2.5

  # ---- 镜筒视场（黑边框+亮圆）：裁黑边 + 作为虹膜尺度/位置先验 ----
  scope_field:
    enabled: true
    v_threshold: 12            # 亮区判定阈值（V 通道），纯黑镜筒边框远低于此
    skip_if_bright_ratio: 0.90 # 亮区占比超过此值视为普通图，不裁剪
    min_fill_ratio: 0.55       # 亮区须基本填满外接圆，否则不视为镜筒图
    min_radius_ratio: 0.25     # 视场圆半径下限（相对小图最短边）
    margin_ratio: 0.02         # 裁剪外接框边距（相对视场半径）
    # 【最关键的定位参数】虹膜半径相对视场半径的允许区间。
    # 旧批次 ~0.47~0.58；0716 手机紧裁批次在自适应视场下 ~0.46~0.64。
    # 换不同镜筒/放大倍率时需重新标定（scripts/_diag_ratios.py）。
    iris_r_min_ratio: 0.42
    iris_r_max_ratio: 0.68
    # 角膜缘外扩系数：Daugman 响应峰略偏边缘内侧，×此值贴合可见虹膜外缘
    limbus_edge_scale: 1.06

  # ---- 巩膜参考白平衡（试点）：取色前将巩膜映射到统一近白 ----
  # 默认关闭，用 scripts/eval_sclera_wb.py 做同人多条件 A/B 后再决定开启与重标定。
  sclera_wb:
    enabled: true
    inner_ratio: 1.08          # 采样环内缘（相对虹膜外半径）
    outer_ratio: 1.28          # 采样环外缘
    v_min: 150.0               # 偏白：亮度下限
    s_max: 60.0                # 偏白：饱和度上限
    highlight_v: 245.0         # 剔除极高光
    vessel_rg_max: 35.0        # 剔除偏红血管：R-G 上限
    vessel_rb_max: 40.0        # 剔除偏红血管：R-B 上限
    min_pixels: 80             # 有效巩膜像素下限，不足则跳过
    clip_channel_min: 250.0    # 通道贴顶判定
    max_clipped_ratio: 0.35    # 贴顶像素占比超此值跳过校正
    target_srgb: [0.92, 0.92, 0.90]  # 目标近白（R,G,B，略暖）
    gain_min: 0.5
    gain_max: 2.0

  # ---- 环带扇区遮挡剔除：砍掉眼皮/睫毛/反光楔形区 ----
  ring_sectors:
    enabled: true
    count: 36                  # 扇区数
    v_dev_max: 45.0            # 扇区亮度中位数偏离全环中位数超过此值即剔除
    min_keep_ratio: 0.40       # 保留扇区占比低于此值视为过滤失败，回退原环带

  # ---- 镜面反光修复（瞳孔亮环、屏幕/窗户反光）----
  specular:
    enabled: true
    v_threshold: 230      # 亮度高于此值视为高光候选
    sat_threshold: 90     # 且饱和度低于此值才算镜面反光
    max_area_ratio: 0.04  # 单个亮斑面积占比上限，超过视为巩膜/皮肤不修复
    dilate_px: 3
    skip_rays: false      # 径向剖面是否跳过反光像素；默认关闭

  # ---- 黑盘直检（镜筒实拍核心；射线拟合为主，Hough 为兜底）----
  disk:
    dark_percentile: 35.0
    min_radius_ratio: 0.10      # 无视场先验时的 Hough 半径下限（相对最短边）
    max_radius_ratio: 0.50      # 无视场先验时的 Hough 半径上限
    circularity_min: 0.55
    surround_contrast: 6.0      # 虹膜到巩膜的平均亮度差下限（有雾化/反光时勿设过高）
    surround_support_min: 0.45  # 满足反差的角度比例下限
    sclera_v_min: 150.0         # 巩膜判定：亮度高于此值
    sclera_s_max: 60.0          # 巩膜判定：饱和度低于此值
    target_min_dim: 700         # 黑盘直检内部工作分辨率
    inner_iris_ratio: 0.40      # 环带内缘（扣掉瞳孔）
    outer_iris_ratio: 0.85      # 环带外缘（留在虹膜中段）

quality:
  # 镜筒特写只统计视场圆内（实测镜筒图 blur 分布 24~142，均高于此阈值）
  blur_threshold: 15.0
  overexposed_ratio_max: 0.15
  min_sample_pixels: 50

highlight_v_threshold: 240

# 调试后门（不对接 iris-web 前端）
debug:
  enabled: true
  api_key: iris-color-dev
  save_to_disk: false
  output_dir: debug_output
