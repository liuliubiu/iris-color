<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iris-vision 调试台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f1419;
      color: #e6edf3;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; color: #8b949e; font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 340px;
      gap: 16px;
      padding: 16px;
      max-width: 1680px;
      margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 1200px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #58a6ff;
    }
    label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 4px; }
    input[type="text"], input[type="file"] { width: 100%; margin-bottom: 10px; }
    input[type="text"] {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }
    .camera-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    video, .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button {
      padding: 8px 14px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: #238636; border-color: #238636; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: #c9d1d9; }
    .error {
      background: #3d1214;
      border: 1px solid #da3633;
      color: #ffa198;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .metrics-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    @media (max-width: 960px) {
      .metrics-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .metric {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      min-width: 0;
    }
    .metric .k { font-size: 11px; color: #8b949e; }
    .metric .v {
      font-size: 15px;
      font-weight: 600;
      color: #79c0ff;
      margin-top: 2px;
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .metric .v.reason {
      font-size: 13px;
      font-weight: 500;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .grade-big {
      font-size: 42px;
      font-weight: 700;
      color: #58a6ff;
      text-align: center;
      margin: 8px 0 16px;
    }
    .stages {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .result-metrics {
      border-top: 1px solid #30363d;
      padding-top: 16px;
      margin-top: 4px;
    }
    .result-metrics .grade-big {
      margin-top: 0;
    }
    .stage {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    .stage h3 {
      margin: 0;
      padding: 8px 10px;
      font-size: 13px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      color: #c9d1d9;
    }
    .stage img { width: 100%; display: block; background: #000; }
    .stage.wide { grid-column: 1 / -1; }
    .stage.wide img { max-height: 560px; object-fit: contain; background: #0d1117; }
    .color-compare {
      margin: 0 0 16px;
      padding: 14px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
    }
    .color-compare > h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: #c9d1d9;
    }
    .color-compare .cc-meta {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .color-compare .cc-meta .ok { color: #3fb950; }
    .color-compare .cc-meta .warn { color: #d29922; }
    .cc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 700px) {
      .cc-grid { grid-template-columns: 1fr; }
    }
    .cc-card {
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      background: #161b22;
    }
    .cc-card .cc-head {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
      color: #e6edf3;
    }
    .cc-card .cc-swatch {
      height: 72px;
      border-bottom: 1px solid #30363d;
    }
    .cc-card .cc-body {
      padding: 10px;
      font-size: 13px;
      line-height: 1.55;
      color: #c9d1d9;
    }
    .cc-card .cc-body strong { color: #58a6ff; }
    .cc-delta {
      margin-top: 10px;
      font-size: 12px;
      color: #8b949e;
    }
    .empty { color: #8b949e; text-align: center; padding: 40px 16px; }
    .run-meta { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
    .history { margin-top: 12px; font-size: 12px; }
    .history a { color: #58a6ff; display: block; margin: 4px 0; }
    .manual-editor { margin: 0; padding: 0; border: none; }
    .manual-panel .empty { padding: 24px 12px; }
    .manual-canvas-wrap { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    #manualCanvas { width: 100%; display: block; cursor: default; touch-action: none; }
    .manual-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .manual-fields input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }
    .manual-hint { font-size: 12px; color: #8b949e; margin-bottom: 10px; line-height: 1.5; }
    .img-source {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }
    .img-source select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .img-path {
      font-size: 12px;
      color: #8b949e;
      word-break: break-all;
      margin-bottom: 8px;
      min-height: 18px;
    }
    .rename-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .label-actions {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #30363d;
    }
    .label-actions #btnRenameGrade {
      width: 100%;
    }
    .rename-status {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 0;
      word-break: break-all;
    }
    .rename-status.ok { color: #3fb950; }
    .rename-status.err { color: #ffa198; }
    .experiment-prefs {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #30363d;
    }
    .experiment-prefs h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #58a6ff;
      font-weight: 600;
    }
    .exp-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .exp-fields label {
      margin-bottom: 0;
      font-size: 12px;
    }
    .exp-fields select,
    .exp-fields input {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 0;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 12px;
    }
    .exp-fields .full { grid-column: 1 / -1; }
    .exp-hint {
      font-size: 11px;
      color: #8b949e;
      margin: 0 0 8px;
      line-height: 1.4;
    }
    #imgSelectStatus {
      min-height: 16px;
      color: #8b949e;
      font-size: 11px;
    }
    #imgSelectStatus.busy { color: #79c0ff; }
    .folder-nav {
      margin: 8px 0;
      padding: 8px 10px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }
    .folder-nav-head {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .folder-nav .btn-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 6px;
      align-items: center;
    }
    .folder-nav select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 12px;
    }
    .folder-nav button {
      white-space: nowrap;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>iris-vision 调试台</h1>
    <p>眼部特写上传/拍照 → 查看瞳孔定位、虹膜环带、去高光、取色区域与 Lab/Grade 参数（不对接 iris-web）</p>
  </header>

  <main>
    <section class="panel">
      <h2>输入</h2>
      <label for="debugKey">Debug Key</label>
      <input id="debugKey" type="text" placeholder="iris-color-dev" />

      <div class="img-source">
        <label for="imgSelect">从 img 文件夹选择（选中后自动识别）</label>
        <select id="imgSelect">
          <option value="">— 载入列表后选择 —</option>
        </select>
        <div class="img-path" id="imgSelectStatus"></div>
        <div class="folder-nav" id="folderNav" hidden>
          <div class="folder-nav-head" id="folderNavLabel">同文件夹</div>
          <div class="btn-row">
            <button type="button" id="btnPrevUnmarked" title="上一张">◀ 上一张</button>
            <select id="folderUnmarkedSelect"></select>
            <button type="button" id="btnNextUnmarked" title="下一张">下一张 ▶</button>
          </div>
        </div>
        <div class="btn-row">
          <button type="button" id="btnLoadImgList">刷新 img 列表</button>
        </div>
        <div class="img-path" id="imgPathHint">未关联 img 文件（本地上传无法重命名）</div>
      </div>

      <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview-img" alt="预览" hidden />
      </div>
      <canvas id="canvas" hidden></canvas>

      <div class="btn-row">
        <button type="button" id="btnCapture" class="primary">拍照</button>
        <button type="button" id="btnUpload">选择文件</button>
        <input id="fileInput" type="file" accept="image/*" hidden />
        <button type="button" id="btnClear">清除</button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="skipQuality" />
        跳过质量检测（模糊/过曝，便于测试糊图）
      </label>

      <button type="button" id="btnAnalyze" style="width:100%" disabled>
        重新识别
      </button>

      <div class="experiment-prefs" id="experimentPrefs" hidden>
        <h3>实验记录 · 组别</h3>
        <p class="exp-hint">日期按<strong>大组</strong>统一；照度、实验人、设备等按<strong>大组+小组</strong>与最近一条记录保持一致。</p>
        <div class="exp-fields">
          <label class="full">实验大组
            <select id="expGroupName"></select>
          </label>
          <label class="full">实验小组
            <select id="expSubgroupName"></select>
          </label>
          <label>实验人
            <select id="expOperator"><option value="">—</option></select>
          </label>
          <label>拍照设备
            <select id="expCamera"><option value="">—</option></select>
          </label>
          <label class="full">光源设备
            <select id="expLight"><option value="">—</option></select>
          </label>
          <label>日期
            <input id="expDate" type="date" />
          </label>
          <label>环境照度 (lux)
            <input id="expIlluminance" type="number" step="1" min="0" placeholder="同组自动带入" />
          </label>
        </div>
        <div class="btn-row">
          <button type="button" id="btnRefreshExpMeta">刷新组别列表</button>
        </div>
      </div>

      <div class="label-actions" id="labelActions" hidden>
        <div class="rename-row">
          <button type="button" id="btnRenameGrade" disabled>追加标记 __G{n}_L{L*}_</button>
          <button type="button" id="btnAddExperiment" hidden>加入实验记录</button>
        </div>
        <label class="checkbox" id="markManualRow">
          <input type="checkbox" id="markManual" />
          人工调整区域（文件名后缀加 _M）
        </label>
        <div class="rename-status" id="renameStatus"></div>
      </div>

      <div class="history" id="history"></div>
    </section>

    <section class="panel" id="resultPanel">
      <h2>识别结果</h2>
      <div id="placeholder" class="empty">拍照或上传后点击「开始识别」</div>
      <div id="errorBox" class="error" hidden></div>
      <div id="resultContent" hidden>
        <div class="run-meta" id="runMeta"></div>
        <div class="color-compare" id="colorCompare" hidden></div>
        <div class="stages" id="stagesGrid"></div>
        <div class="result-metrics">
          <div class="grade-big" id="gradeDisplay"></div>
          <div class="metrics-summary" id="metricsSummary"></div>
          <div class="metrics" id="metricsGrid"></div>
        </div>
      </div>
    </section>

    <section class="panel manual-panel" id="manualPanel">
      <h2>人工调整</h2>
      <div id="manualPlaceholder" class="empty">识别完成后，在此拖动圆环调整取色区域</div>
      <div class="manual-editor" id="manualEditor" hidden>
        <div class="manual-hint">拖动中心移动整组圆；拖动蓝/红/绿圆边分别调整瞳孔、内环、外环。也可直接改数值。</div>
        <div class="manual-canvas-wrap">
          <canvas id="manualCanvas"></canvas>
        </div>
        <div class="manual-fields">
          <label>中心 X<input id="manualCenterX" type="number" step="1" /></label>
          <label>中心 Y<input id="manualCenterY" type="number" step="1" /></label>
          <label>瞳孔半径<input id="manualPupilRadius" type="number" step="1" min="1" /></label>
          <label>内环半径<input id="manualInnerRadius" type="number" step="1" min="1" /></label>
          <label>外环半径<input id="manualOuterRadius" type="number" step="1" min="1" /></label>
        </div>
        <button type="button" id="btnManualAnalyze" class="primary" style="width:100%">
          应用人工调整并重新识别
        </button>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search)
    const keyInput = document.getElementById('debugKey')
    keyInput.value = params.get('key') || localStorage.getItem('iris_debug_key') || 'iris-color-dev'

    const video = document.getElementById('video')
    const preview = document.getElementById('preview')
    const canvas = document.getElementById('canvas')
    const fileInput = document.getElementById('fileInput')
    const btnAnalyze = document.getElementById('btnAnalyze')
    const manualEditor = document.getElementById('manualEditor')
    const manualCanvas = document.getElementById('manualCanvas')
    const manualCtx = manualCanvas.getContext('2d')
    const manualInputs = {
      center_x: document.getElementById('manualCenterX'),
      center_y: document.getElementById('manualCenterY'),
      pupil_radius: document.getElementById('manualPupilRadius'),
      inner_radius: document.getElementById('manualInnerRadius'),
      outer_radius: document.getElementById('manualOuterRadius'),
    }
    let currentBlob = null
    let currentImgRel = null
    let lastGrade = null
    let lastRunId = null
    let lastMetrics = null
    let lastManualAdjusted = false
    let lastSkipQuality = false
    let imgFileList = []
    let mediaStream = null
    let manualState = null
    let manualImage = new Image()
    let dragMode = null
    let analyzing = false
    let suppressImgSelectChange = false
    let suppressFolderSelectChange = false
    let suppressExpSubgroupChange = false
    let activeFolderPrefix = ''
    let lastGroupRefresh = 0
    let experimentWin = null

    const EXP_WIN_NAME = 'iris_experiment_ui'
    const EXP_SYNC_CHANNEL = 'iris-experiment-sync'
    const EXP_IMPORT_CHANNEL = 'iris-experiment-import'

    const STAGE_LABELS = {
      '00_original': '原图',
      '07_sclera_before_after': '巩膜调色前 / 调色后（裁切 + Lab 色块）',
      '06_sclera_samples': '巩膜参考采样（品红=采样像素）',
      '01_pupil_candidates': '瞳孔候选（黄=极暗候选区域）',
      '01_pupil_localization': '瞳孔定位（黄框=搜索区，蓝圆=瞳孔）',
      '02_iris_ring': '虹膜环带（绿=外缘，红=内缘）',
      '03_highlight_rejection': '剔除干扰（红=高光/过亮/极暗）',
      '04_valid_samples': '最终取色像素（绿=参与 Lab）',
      '05_ring_mask_only': '环带 mask 伪彩色',
    }

    const EXP_PREFS_KEY = 'iris_debug_exp_prefs'
    let expDistinct = { group_name: [], subgroup_name: [], operator: [], camera_device: [], light_device: [] }

    function todayStr() {
      const d = new Date()
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
    }

    function loadExpPrefs() {
      try {
        return JSON.parse(localStorage.getItem(EXP_PREFS_KEY) || '{}')
      } catch (_) {
        return {}
      }
    }

    function saveExpPrefs() {
      localStorage.setItem(EXP_PREFS_KEY, JSON.stringify(collectExperimentContext()))
    }

    function getPreferredSubgroup() {
      const dom = document.getElementById('expSubgroupName')?.value?.trim() || ''
      const prefs = loadExpPrefs().subgroup_name?.trim() || ''
      return dom || prefs
    }

    function setSubgroupSelection(value) {
      const subSelect = document.getElementById('expSubgroupName')
      const val = value == null ? '' : String(value).trim()
      if (!subSelect || !val) return
      suppressExpSubgroupChange = true
      if (![...subSelect.options].some((opt) => opt.value === val)) {
        subSelect.add(new Option(val, val))
      }
      subSelect.value = val
      suppressExpSubgroupChange = false
    }

    function fillSelectOptions(select, values, selected, { lockSelection = false } = {}) {
      const uniq = [...new Set((values || []).filter(Boolean))]
      let html = uniq.map((v) =>
        `<option value="${String(v).replace(/"/g, '&quot;')}">${v}</option>`
      ).join('')
      const selectedStr = selected == null ? '' : String(selected).trim()
      if (selectedStr && !uniq.includes(selectedStr)) {
        html += `<option value="${String(selectedStr).replace(/"/g, '&quot;')}">${selectedStr}</option>`
      }
      select.innerHTML = html || '<option value="">— 暂无 —</option>'
      if (selectedStr) {
        select.value = selectedStr
      } else if (!lockSelection && uniq.length) {
        select.value = uniq[0]
      } else {
        select.value = ''
      }
    }

    function fillOptionalSelect(select, values, selected) {
      const uniq = [...new Set((values || []).filter(Boolean))]
      select.innerHTML = '<option value="">—</option>' + uniq.map((v) =>
        `<option value="${String(v).replace(/"/g, '&quot;')}">${v}</option>`
      ).join('')
      if (selected) select.value = selected
    }

    function getFolderPrefix(rel) {
      if (!rel) return ''
      const idx = rel.lastIndexOf('/')
      return idx >= 0 ? rel.slice(0, idx) : ''
    }

    function isImgMarked(item) {
      return item.grade_prefix != null
    }

    function getSortedFolderItems(folder) {
      if (!folder) return []
      return imgFileList
        .filter((item) => getFolderPrefix(item.rel) === folder)
        .sort((a, b) => a.rel.localeCompare(b.rel, 'zh-CN'))
    }

    function findNextInFolder(folder, afterRel) {
      const sorted = getSortedFolderItems(folder)
      if (!sorted.length) return null
      const startIdx = afterRel ? sorted.findIndex((item) => item.rel === afterRel) : -1
      if (startIdx < 0) return sorted[0]
      return startIdx + 1 < sorted.length ? sorted[startIdx + 1] : null
    }

    function findPrevInFolder(folder, beforeRel) {
      const sorted = getSortedFolderItems(folder)
      if (!sorted.length) return null
      const startIdx = beforeRel ? sorted.findIndex((item) => item.rel === beforeRel) : sorted.length
      if (startIdx < 0) return sorted[sorted.length - 1]
      return startIdx - 1 >= 0 ? sorted[startIdx - 1] : null
    }

    function sortImgListForSelect(items, activeFolder) {
      return [...items].sort((a, b) => {
        const aMarked = isImgMarked(a) ? 1 : 0
        const bMarked = isImgMarked(b) ? 1 : 0
        if (aMarked !== bMarked) return aMarked - bMarked
        if (activeFolder && !aMarked) {
          const aSame = getFolderPrefix(a.rel) === activeFolder ? 0 : 1
          const bSame = getFolderPrefix(b.rel) === activeFolder ? 0 : 1
          if (aSame !== bSame) return aSame - bSame
        }
        return a.rel.localeCompare(b.rel, 'zh-CN')
      })
    }

    function formatImgOption(item) {
      const grade = item.grade_prefix ? `G${item.grade_prefix}` : ''
      const lStar = item.l_star_prefix != null ? ` L${Number(item.l_star_prefix).toFixed(1)}` : ''
      const manual = item.manual_adjusted ? ' M' : ''
      const tag = grade ? ` [${grade}${lStar}${manual}]` : ''
      const safeRel = String(item.rel).replace(/"/g, '&quot;')
      return `<option value="${safeRel}">${item.rel}${tag}</option>`
    }

    function renderFolderUnmarkedSelect(selectedRel) {
      const select = document.getElementById('folderUnmarkedSelect')
      const nav = document.getElementById('folderNav')
      const label = document.getElementById('folderNavLabel')
      const folder = activeFolderPrefix || getFolderPrefix(selectedRel || currentImgRel)
      const btnPrev = document.getElementById('btnPrevUnmarked')
      const btnNext = document.getElementById('btnNextUnmarked')
      const activeRel = selectedRel || currentImgRel || ''
      if (!folder) {
        nav.hidden = true
        select.innerHTML = '<option value="">—</option>'
        select.title = ''
        return
      }
      const folderItems = getSortedFolderItems(folder)
      const prevItem = findPrevInFolder(folder, activeRel)
      const nextItem = findNextInFolder(folder, activeRel)
      nav.hidden = false
      label.textContent = folder
      label.title = folder
      btnPrev.title = prevItem ? prevItem.rel : '已是第一张'
      btnNext.title = nextItem ? nextItem.rel : '已是最后一张'
      if (!folderItems.length) {
        select.innerHTML = '<option value="">（空文件夹）</option>'
        select.disabled = true
        select.title = folder
        btnPrev.disabled = true
        btnNext.disabled = true
        return
      }
      const currentIdx = activeRel ? folderItems.findIndex((item) => item.rel === activeRel) : -1
      if (currentIdx >= 0) {
        label.textContent = `${folder} · ${currentIdx + 1}/${folderItems.length} 张`
      } else {
        label.textContent = `${folder} · ${folderItems.length} 张`
      }
      select.disabled = analyzing
      select.innerHTML = folderItems.map((item, idx) => {
        const name = item.name || item.rel.split('/').pop()
        const markTag = isImgMarked(item) ? ' [已标记]' : ''
        const safeRel = String(item.rel).replace(/"/g, '&quot;')
        const safeTitle = String(item.rel).replace(/"/g, '&quot;')
        return `<option value="${safeRel}" title="${safeTitle}">${idx + 1}. ${name}${markTag}</option>`
      }).join('')
      suppressFolderSelectChange = true
      if (currentIdx >= 0) {
        select.value = activeRel
      } else {
        select.value = folderItems[0].rel
      }
      suppressFolderSelectChange = false
      select.title = currentIdx >= 0 ? activeRel : folderItems[0].rel
      const disableNav = analyzing || folderItems.length < 2
      btnPrev.disabled = disableNav
      btnNext.disabled = disableNav
    }

    function renderImgSelectOptions(selectedRel) {
      const select = document.getElementById('imgSelect')
      const activeFolder = activeFolderPrefix || getFolderPrefix(selectedRel)
      const sorted = sortImgListForSelect(imgFileList, activeFolder)
      const groups = { currentUnmarked: [], otherUnmarked: [], marked: [] }
      for (const item of sorted) {
        if (isImgMarked(item)) groups.marked.push(item)
        else if (activeFolder && getFolderPrefix(item.rel) === activeFolder) groups.currentUnmarked.push(item)
        else groups.otherUnmarked.push(item)
      }
      let html = '<option value="">— 选择图片 —</option>'
      if (groups.currentUnmarked.length) {
        html += `<optgroup label="当前文件夹 · 未标记">${groups.currentUnmarked.map(formatImgOption).join('')}</optgroup>`
      }
      if (groups.otherUnmarked.length) {
        html += `<optgroup label="其它 · 未标记">${groups.otherUnmarked.map(formatImgOption).join('')}</optgroup>`
      }
      if (groups.marked.length) {
        html += `<optgroup label="已标记">${groups.marked.map(formatImgOption).join('')}</optgroup>`
      }
      suppressImgSelectChange = true
      select.innerHTML = html
      const selectedItem = selectedRel ? imgFileList.find((item) => item.rel === selectedRel) : null
      const mainSelectRel = selectedItem && isImgMarked(selectedItem) ? '' : selectedRel
      if (mainSelectRel) select.value = mainSelectRel
      suppressImgSelectChange = false
      renderFolderUnmarkedSelect(selectedRel)
    }

    function resortImgSelect() {
      if (!imgFileList.length) return
      const selectedRel = document.getElementById('imgSelect').value || currentImgRel || ''
      renderImgSelectOptions(selectedRel)

    async function navigateFolderUnmarked(delta) {
      const folder = activeFolderPrefix || getFolderPrefix(currentImgRel)
      if (!folder) return
      const item = delta > 0
        ? findNextInFolder(folder, currentImgRel)
        : findPrevInFolder(folder, currentImgRel)
      if (!item) {
        setAnalyzeStatus(delta > 0 ? '已是本文件夹最后一张' : '已是本文件夹第一张')
        return
      }
      await loadImgFromRel(item.rel)
    }

    function setAnalyzeStatus(text, busy = false) {
      const el = document.getElementById('imgSelectStatus')
      el.textContent = text || ''
      el.className = busy ? 'busy' : ''
    }

    function findDistinctMatch(segment, candidates, allowPartial) {
      const norm = segment.trim().toLowerCase()
      if (!norm || !candidates?.length) return null
      for (const c of candidates) {
        if (c.trim().toLowerCase() === norm) return c
      }
      if (!allowPartial) return null
      for (const c of candidates) {
        const cn = c.trim().toLowerCase()
        if (cn.includes(norm) || norm.includes(cn)) return c
      }
      return null
    }

    function inferFieldsFromImagePath(rel) {
      const segments = rel.split('/').slice(0, -1)
      let operator = null
      let camera = null
      for (const seg of segments) {
        if (!operator) operator = findDistinctMatch(seg, expDistinct.operator, false)
        if (!camera) camera = findDistinctMatch(seg, expDistinct.camera_device, true)
      }
      return { operator, camera_device: camera }
    }

    async function applyPathInferredFields(rel) {
      if (!rel) return
      const inferred = inferFieldsFromImagePath(rel)
      if (inferred.operator) document.getElementById('expOperator').value = inferred.operator
      if (inferred.camera_device) document.getElementById('expCamera').value = inferred.camera_device
      saveExpPrefs()
    }

    async function refreshExperimentGroups({ reloadSubgroupList = false } = {}) {
      const groupSelect = document.getElementById('expGroupName')
      const currentGroup = groupSelect.value.trim()
      const currentSubgroup = getPreferredSubgroup()
      const currentOperator = document.getElementById('expOperator').value
      const currentCamera = document.getElementById('expCamera').value
      const currentLight = document.getElementById('expLight').value
      try {
        const options = await expApiFetch('/experiments/meta/options')
        expDistinct = options
        let groups = [...(options.group_name || [])]
        try {
          const suggest = await expApiFetch('/experiments/meta/suggest-names', { query: { date: todayStr() } })
          if (suggest.group_name && !groups.includes(suggest.group_name)) groups.push(suggest.group_name)
        } catch (_) {}
        fillSelectOptions(groupSelect, groups, currentGroup || groups[0])
        fillOptionalSelect(document.getElementById('expOperator'), options.operator, currentOperator)
        fillOptionalSelect(document.getElementById('expCamera'), options.camera_device, currentCamera)
        fillOptionalSelect(document.getElementById('expLight'), options.light_device, currentLight)
        const targetGroup = groupSelect.value.trim()
        if (reloadSubgroupList) {
          await loadSubgroupOptions(targetGroup, currentSubgroup, { includeSuggest: true })
        }
        lastGroupRefresh = Date.now()
      } catch (_) {}
    }

    function setupExperimentSync() {
      try {
        const channel = new BroadcastChannel(EXP_SYNC_CHANNEL)
        channel.onmessage = async (event) => {
          const data = event.data || {}
          if (data.type !== 'record_saved') return
          const savedSubgroup = data.subgroup_name || getPreferredSubgroup()
          await refreshExperimentGroups({ reloadSubgroupList: true })
          if (savedSubgroup) {
            setSubgroupSelection(savedSubgroup)
            saveExpPrefs()
          }
        }
      } catch (_) {}

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return
        if (Date.now() - lastGroupRefresh < 3000) return
        refreshExperimentGroups()
      })
      window.addEventListener('focus', () => {
        if (Date.now() - lastGroupRefresh < 3000) return
        refreshExperimentGroups()
      })
    }

    function openExperimentImport(url, { importRun = null, importDraft = false, draft = null } = {}) {
      const sep = url.includes('?') ? '&' : '?'
      const fullUrl = `${url}${sep}t=${Date.now()}`

      try {
        new BroadcastChannel(EXP_IMPORT_CHANNEL).postMessage({
          type: 'debug_import',
          import_run: importRun,
          import_draft: importDraft,
          draft,
        })
      } catch (_) {}

      let targetWin = null
      try {
        targetWin = window.open('', EXP_WIN_NAME)
      } catch (_) {}

      if (targetWin && !targetWin.closed) {
        experimentWin = targetWin
        let onExperimentPage = false
        try {
          onExperimentPage = /\/experiments\/ui/.test(targetWin.location.pathname)
        } catch (_) {}
        if (onExperimentPage) {
          targetWin.focus()
          return
        }
        try {
          targetWin.location.href = fullUrl
          targetWin.focus()
        } catch (_) {
          experimentWin = window.open(fullUrl, EXP_WIN_NAME)
        }
        return
      }

      experimentWin = window.open(fullUrl, EXP_WIN_NAME)
    }

    async function expApiFetch(path, opts = {}) {
      const apiKey = keyInput.value.trim()
      const url = new URL(path, location.origin)
      url.searchParams.set('key', apiKey)
      if (opts.query) {
        Object.entries(opts.query).forEach(([k, v]) => {
          if (v != null && v !== '') url.searchParams.set(k, v)
        })
      }
      const res = await fetch(url.toString(), {
        method: opts.method || 'GET',
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      })
      if (!res.ok) {
        const data = await res.json().catch(() => ({}))
        throw new Error(typeof data.detail === 'string' ? data.detail : (data.detail || res.statusText))
      }
      return res.json()
    }

    async function loadSubgroupOptions(groupName, preferred, { includeSuggest = true } = {}) {
      const subSelect = document.getElementById('expSubgroupName')
      const keep = preferred !== undefined && preferred !== null ? preferred : getPreferredSubgroup()
      let subs = []
      if (groupName) {
        try {
          const data = await expApiFetch('/experiments/records', { query: { group_name: groupName } })
          subs = [...new Set((data.records || []).map((r) => r.subgroup_name).filter(Boolean))]
        } catch (_) {}
        if (includeSuggest) {
          try {
            const suggest = await expApiFetch('/experiments/meta/suggest-names', {
              query: { group_name: groupName, date: todayStr() },
            })
            if (suggest.subgroup_name && !subs.includes(suggest.subgroup_name)) {
              subs.push(suggest.subgroup_name)
            }
          } catch (_) {}
        }
      }
      if (!subs.length && includeSuggest) subs = expDistinct.subgroup_name || []
      suppressExpSubgroupChange = true
      fillSelectOptions(subSelect, subs, keep, { lockSelection: true })
      suppressExpSubgroupChange = false
    }

    function paramsFromMetrics(m) {
      return {
        center_x: m.pupil_center?.[0] ?? 0,
        center_y: m.pupil_center?.[1] ?? 0,
        pupil_radius: m.pupil_radius ?? 5,
        inner_radius: m.inner_radius ?? Math.max((m.pupil_radius ?? 5) * 1.2, 8),
        outer_radius: m.outer_radius ?? Math.max((m.pupil_radius ?? 5) * 2.5, 16),
      }
    }

    function syncManualInputs() {
      if (!manualState) return
      for (const [key, input] of Object.entries(manualInputs)) {
        input.value = Math.round(manualState[key])
      }
    }

    function syncManualStateFromInputs() {
      if (!manualState) return
      for (const [key, input] of Object.entries(manualInputs)) {
        manualState[key] = Number(input.value || manualState[key])
      }
      normalizeManualState()
      drawManualCanvas()
    }

    function normalizeManualState() {
      if (!manualState) return
      const minDim = Math.min(manualCanvas.width || 1, manualCanvas.height || 1)
      manualState.center_x = Math.max(0, Math.min(manualCanvas.width - 1, manualState.center_x))
      manualState.center_y = Math.max(0, Math.min(manualCanvas.height - 1, manualState.center_y))
      manualState.pupil_radius = Math.max(2, Math.min(manualState.pupil_radius, minDim * 0.45))
      manualState.inner_radius = Math.max(manualState.pupil_radius + 1, Math.min(manualState.inner_radius, minDim * 0.48))
      manualState.outer_radius = Math.max(manualState.inner_radius + 2, Math.min(manualState.outer_radius, minDim * 0.50))
      syncManualInputs()
    }

    function drawManualCanvas() {
      if (!manualState || !manualImage.complete || !manualCtx) return
      manualCtx.clearRect(0, 0, manualCanvas.width, manualCanvas.height)
      manualCtx.drawImage(manualImage, 0, 0)
      const { center_x: cx, center_y: cy, pupil_radius: pr, inner_radius: ir, outer_radius: or } = manualState
      manualCtx.lineWidth = Math.max(2, manualCanvas.width / 240)
      manualCtx.fillStyle = 'rgba(0, 255, 255, 0.18)'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, or, 0, Math.PI * 2)
      manualCtx.arc(cx, cy, ir, 0, Math.PI * 2, true)
      manualCtx.fill()
      manualCtx.strokeStyle = '#2f81f7'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, pr, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#ff4d4f'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, ir, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#3fb950'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, or, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#ff4d4f'
      manualCtx.beginPath()
      manualCtx.moveTo(cx - 8, cy)
      manualCtx.lineTo(cx + 8, cy)
      manualCtx.moveTo(cx, cy - 8)
      manualCtx.lineTo(cx, cy + 8)
      manualCtx.stroke()
    }

    function canvasPoint(event) {
      const rect = manualCanvas.getBoundingClientRect()
      return {
        x: (event.clientX - rect.left) * manualCanvas.width / rect.width,
        y: (event.clientY - rect.top) * manualCanvas.height / rect.height,
      }
    }

    function hitMode(point) {
      if (!manualState) return null
      const dx = point.x - manualState.center_x
      const dy = point.y - manualState.center_y
      const dist = Math.hypot(dx, dy)
      const tol = Math.max(8, manualCanvas.width / 80)
      if (dist < tol) return 'move'
      if (Math.abs(dist - manualState.pupil_radius) < tol) return 'pupil_radius'
      if (Math.abs(dist - manualState.inner_radius) < tol) return 'inner_radius'
      if (Math.abs(dist - manualState.outer_radius) < tol) return 'outer_radius'
      return null
    }

    function updateManualCursor(event) {
      if (dragMode) {
        manualCanvas.style.cursor = 'grabbing'
        return
      }
      manualCanvas.style.cursor = hitMode(canvasPoint(event)) ? 'grab' : 'default'
    }

    function setManualEditorVisible(visible) {
      manualEditor.hidden = !visible
      document.getElementById('manualPlaceholder').hidden = visible
    }

    function setupManualEditor(metrics, originalUrl) {
      manualState = paramsFromMetrics(metrics)
      manualImage = new Image()
      manualImage.onload = () => {
        manualCanvas.width = manualImage.naturalWidth
        manualCanvas.height = manualImage.naturalHeight
        normalizeManualState()
        drawManualCanvas()
        setManualEditorVisible(true)
      }
      manualImage.src = originalUrl
    }

    for (const input of Object.values(manualInputs)) {
      input.addEventListener('change', syncManualStateFromInputs)
      input.addEventListener('input', syncManualStateFromInputs)
    }

    manualCanvas.addEventListener('pointerdown', (event) => {
      if (!manualState) return
      dragMode = hitMode(canvasPoint(event))
      if (dragMode) {
        manualCanvas.style.cursor = 'grabbing'
        manualCanvas.setPointerCapture(event.pointerId)
      }
    })

    manualCanvas.addEventListener('pointermove', (event) => {
      if (!manualState) return
      if (!dragMode) {
        updateManualCursor(event)
        return
      }
      const point = canvasPoint(event)
      if (dragMode === 'move') {
        manualState.center_x = point.x
        manualState.center_y = point.y
      } else {
        manualState[dragMode] = Math.hypot(point.x - manualState.center_x, point.y - manualState.center_y)
      }
      normalizeManualState()
      drawManualCanvas()
    })

    manualCanvas.addEventListener('pointerup', (event) => {
      dragMode = null
      updateManualCursor(event)
      try { manualCanvas.releasePointerCapture(event.pointerId) } catch (_) {}
    })

    manualCanvas.addEventListener('pointercancel', () => {
      dragMode = null
      manualCanvas.style.cursor = 'default'
    })
    manualCanvas.addEventListener('pointerleave', () => {
      if (!dragMode) manualCanvas.style.cursor = 'default'
    })

    function escapeHtml(text) {
      return String(text ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    function metricCard(label, value, { reason = false } = {}) {
      const safeLabel = escapeHtml(label)
      const raw = value ?? '-'
      const safeValue = escapeHtml(raw)
      const title = reason && raw !== '-' ? ` title="${escapeHtml(raw)}"` : ''
      const valueClass = reason ? 'v reason' : 'v'
      return `<div class="metric"><div class="k">${safeLabel}</div><div class="${valueClass}"${title}>${safeValue}</div></div>`
    }

    function renderColorCompare(m) {
      const el = document.getElementById('colorCompare')
      const cc = m?.color_correction
      if (!cc?.before || !cc?.after) {
        el.hidden = true
        el.innerHTML = ''
        return
      }
      const fmtLab = (lab) => `L* ${lab.L} / a* ${lab.a} / b* ${lab.b}`
      const sideCard = (title, side) => `
        <div class="cc-card">
          <div class="cc-head">${title}</div>
          <div class="cc-swatch" style="background:${side.hex || '#333'}"></div>
          <div class="cc-body">
            <div><strong>Grade ${side.grade}</strong> · ${escapeHtml(side.iris_color?.label || '-')}</div>
            <div>${escapeHtml(fmtLab(side.lab))}</div>
            <div>hex ${escapeHtml(side.hex || '-')}</div>
          </div>
        </div>`
      const statusCls = cc.applied ? 'ok' : 'warn'
      const statusText = cc.applied ? `已应用校正（${escapeHtml(cc.status)}）` : `未应用校正（${escapeHtml(cc.status)}）`
      const gains = cc.gains ? `gains=[${cc.gains.map((g) => Number(g).toFixed(3)).join(', ')}]` : 'gains=-'
      const sclera = cc.sclera_lab
        ? `巩膜 Lab=(${cc.sclera_lab.L}, ${cc.sclera_lab.a}, ${cc.sclera_lab.b})`
        : '巩膜 Lab=-'
      const d = cc.delta || {}
      el.innerHTML = `
        <h3>巩膜调色前 / 调色后</h3>
        <div class="cc-meta">
          <span class="${statusCls}">${statusText}</span><br/>
          ${escapeHtml(gains)} · ${escapeHtml(sclera)}
        </div>
        <div class="cc-grid">
          ${sideCard('调色前（原始取色）', cc.before)}
          ${sideCard('调色后（巩膜归一化）', cc.after)}
        </div>
        <div class="cc-delta">
          ΔL*=${d.L ?? '-'}　Δa*=${d.a ?? '-'}　Δb*=${d.b ?? '-'}　
          Grade${d.grade_changed ? '有变化' : '不变'}　
          颜色${d.color_changed ? '有变化' : '不变'}
        </div>`
      el.hidden = false
    }

    function renderMetrics(m) {
      const sn = m.sclera_normalization || {}
      const summaryItems = [
        ['Grade', m.grade],
        ['虹膜颜色', m.iris_color?.label],
        ['颜色置信度', m.iris_color?.confidence != null ? (m.iris_color.confidence * 100).toFixed(0) + '%' : '-'],
        ['颜色依据', m.iris_color?.reason],
      ]
      const detailItems = [
        ['置信度', (m.confidence * 100).toFixed(0) + '%'],
        ['L*', m.lab?.L],
        ['a*', m.lab?.a],
        ['b*', m.lab?.b],
        ['巩膜校正', sn.applied ? '已应用' : (sn.status || '-')],
        ['巩膜增益', sn.gains ? sn.gains.map((g) => Number(g).toFixed(3)).join(', ') : '-'],
        ['定位方式', m.detection_method],
        ['瞳孔方法', m.pupil_method],
        ['虹膜外缘方法', m.iris_outer_method],
        ['瞳孔置信度', m.pupil_confidence?.toFixed?.(2) ?? '-'],
        ['虹膜置信度', m.iris_confidence?.toFixed?.(2) ?? '-'],
        ['候选数量', m.candidate_count],
        ['瞳孔半径', m.pupil_radius?.toFixed?.(1) ?? '-'],
        ['环带内径', m.inner_radius?.toFixed?.(1) ?? '-'],
        ['环带外径', m.outer_radius?.toFixed?.(1) ?? '-'],
        ['环带像素', m.ring_pixel_count],
        ['剔除高光', m.highlight_rejected_count],
        ['剔除过亮', m.bright_rejected_count],
        ['剔除极暗', m.dark_rejected_count],
        ['有效采样', m.valid_sample_count],
        ['清晰度', m.blur_score],
        ['过曝比', m.overexposed_ratio],
        ['高光阈值 V', m.highlight_v_threshold],
      ]
      document.getElementById('metricsSummary').innerHTML = summaryItems.map(([k, v], idx) =>
        metricCard(k, v, { reason: idx === 3 })
      ).join('')
      document.getElementById('metricsGrid').innerHTML = detailItems.map(([k, v]) =>
        metricCard(k, v)
      ).join('')
    }

    function imageSourcesFromResponse(data) {
      const sources = { ...(data.image_urls || {}) }
      for (const [key, value] of Object.entries(data.images_base64 || {})) {
        sources[key] = `data:image/jpeg;base64,${value}`
      }
      return sources
    }

    function renderStages(imageSources) {
      const order = Object.keys(STAGE_LABELS)
      document.getElementById('stagesGrid').innerHTML = order
        .filter((k) => imageSources[k])
        .map((k) => {
          const wide = k === '07_sclera_before_after' ? ' wide' : ''
          return `<div class="stage${wide}"><h3>${STAGE_LABELS[k]}</h3><img src="${imageSources[k]}" alt="${k}"/></div>`
        })
        .join('')
    }

    async function loadHistory(apiKey) {
      try {
        const res = await fetch('/debug/runs?limit=8', { headers: { 'X-Debug-Key': apiKey } })
        const data = await res.json()
        const el = document.getElementById('history')
        if (!data.runs?.length) { el.innerHTML = ''; return }
        el.innerHTML = '<strong>最近运行：</strong>' + data.runs.map(r =>
          `<a href="${r.viewer_url}" target="_blank">${r.run_id}</a>`
        ).join('')
      } catch (_) {}
    }

    async function runAnalyze() {
      if (!currentBlob || analyzing) return
      const apiKey = keyInput.value.trim()
      localStorage.setItem('iris_debug_key', apiKey)
      const skipQ = document.getElementById('skipQuality').checked
      lastSkipQuality = skipQ
      const imgSelect = document.getElementById('imgSelect')

      analyzing = true
      imgSelect.disabled = true
      btnAnalyze.disabled = true
      btnAnalyze.textContent = '识别中...'
      setAnalyzeStatus('识别中...', true)

      document.getElementById('placeholder').hidden = true
      document.getElementById('errorBox').hidden = true
      document.getElementById('resultContent').hidden = true

      const form = new FormData()
      form.append('file', currentBlob, 'capture.jpg')
      if (currentImgRel) form.append('source_rel', currentImgRel)

      try {
        const url = `/debug/analyze?skip_quality=${skipQ}&key=${encodeURIComponent(apiKey)}`
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'X-Debug-Key': apiKey },
          body: form,
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'object'
            ? JSON.stringify(data.detail, null, 2)
            : (data.detail || res.statusText))
        }

        document.getElementById('resultContent').hidden = false
        lastGrade = data.metrics.grade
        lastMetrics = data.metrics
        lastRunId = data.run_id || null
        updateExperimentButton()
        setManualMarkFlag(false)
        document.getElementById('gradeDisplay').textContent =
          formatGradeDisplay(data.metrics.grade, data.metrics.lab?.L, false)
        document.getElementById('runMeta').textContent =
          data.run_id
            ? `run_id: ${data.run_id} | 保存目录: ${data.saved_dir || '-'}`
            : (currentImgRel
              ? `未写入磁盘（save_to_disk=false）；可关联 img/${currentImgRel} 并导入实验记录`
              : '未写入磁盘（save_to_disk=false）；识别结果可导入实验记录，本地上传图无 img 关联')
        updateRenameButton()
        const imageSources = imageSourcesFromResponse(data)
        renderColorCompare(data.metrics)
        renderMetrics(data.metrics)
        renderStages(imageSources)
        setupManualEditor(data.metrics, imageSources['00_original'])
        loadHistory(apiKey)
      } catch (err) {
        document.getElementById('errorBox').hidden = false
        document.getElementById('errorBox').textContent = String(err.message || err)
      } finally {
        analyzing = false
        imgSelect.disabled = false
        btnAnalyze.disabled = !currentBlob
        btnAnalyze.textContent = '重新识别'
        setAnalyzeStatus('')
        renderFolderUnmarkedSelect(currentImgRel)
      }
    }

    document.getElementById('btnAnalyze').onclick = () => runAnalyze()

    document.getElementById('btnManualAnalyze').onclick = async () => {
      if (!currentBlob || !manualState) return
      const apiKey = keyInput.value.trim()
      const skipQ = document.getElementById('skipQuality').checked
      lastSkipQuality = skipQ
      const btn = document.getElementById('btnManualAnalyze')
      btn.disabled = true
      btn.textContent = '人工调整识别中...'

      const form = new FormData()
      form.append('file', currentBlob, 'manual-adjustment.jpg')
      form.append('manual_params', JSON.stringify(manualState))
      if (currentImgRel) form.append('source_rel', currentImgRel)

      try {
        const url = `/debug/analyze/manual?skip_quality=${skipQ}&key=${encodeURIComponent(apiKey)}`
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'X-Debug-Key': apiKey },
          body: form,
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'object'
            ? JSON.stringify(data.detail, null, 2)
            : (data.detail || res.statusText))
        }
        document.getElementById('resultContent').hidden = false
        lastGrade = data.metrics.grade
        lastMetrics = data.metrics
        lastRunId = data.run_id || null
        updateExperimentButton()
        setManualMarkFlag(true)
        document.getElementById('gradeDisplay').textContent =
          formatGradeDisplay(data.metrics.grade, data.metrics.lab?.L, true)
        document.getElementById('runMeta').textContent =
          data.run_id
            ? `run_id: ${data.run_id} | 保存目录: ${data.saved_dir || '-'} | 人工调整`
            : (currentImgRel
              ? `未写入磁盘；可关联 img/${currentImgRel} 并导入实验记录 | 人工调整`
              : '未写入磁盘；识别结果可导入实验记录 | 人工调整')
        updateRenameButton()
        const imageSources = imageSourcesFromResponse(data)
        renderColorCompare(data.metrics)
        renderMetrics(data.metrics)
        renderStages(imageSources)
        setupManualEditor(data.metrics, imageSources['00_original'])
        loadHistory(apiKey)
      } catch (err) {
        document.getElementById('errorBox').hidden = false
        document.getElementById('errorBox').textContent = String(err.message || err)
      } finally {
        btn.disabled = false
        btn.textContent = '应用人工调整并重新识别'
      }
    }

    document.getElementById('btnRenameGrade').onclick = async () => {
      if (!currentImgRel || !lastGrade || lastMetrics?.lab?.L == null) return
      const apiKey = keyInput.value.trim()
      const btn = document.getElementById('btnRenameGrade')
      const statusEl = document.getElementById('renameStatus')
      const oldRel = currentImgRel
      btn.disabled = true
      statusEl.textContent = '标记中...'
      statusEl.className = 'rename-status'

      try {
        const res = await fetch(`/debug/rename-grade?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: {
            'X-Debug-Key': apiKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            rel: currentImgRel,
            grade: lastGrade,
            lab: lastMetrics.lab,
            iris_color: lastMetrics.iris_color,
            confidence: lastMetrics.confidence,
            manual_adjusted: document.getElementById('markManual').checked,
          }),
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail))
        }
        currentImgRel = data.new_rel
        activeFolderPrefix = getFolderPrefix(oldRel) || getFolderPrefix(data.new_rel)
        updateImgPathHint()
        const lText = data.l_star != null ? `，L*=${Number(data.l_star).toFixed(2)}` : ''
        const mText = data.manual_adjusted ? '，人工调整' : ''
        statusEl.textContent = `已标记：${oldRel} → ${data.new_rel}${lText}${mText}（索引已写入 labels/img_labels.json）`
        statusEl.className = 'rename-status ok'
        await loadImgList()
        suppressImgSelectChange = true
        document.getElementById('imgSelect').value = ''
        suppressImgSelectChange = false
        resortImgSelect()
        renderFolderUnmarkedSelect(currentImgRel)
      } catch (err) {
        statusEl.textContent = '标记失败：' + (err.message || err)
        statusEl.className = 'rename-status err'
      } finally {
        updateRenameButton()
      }
    }

    document.getElementById('markManual').addEventListener('change', updateRenameButton)

    document.getElementById('btnAddExperiment').onclick = () => {
      if (!lastMetrics) return
      const apiKey = keyInput.value.trim()
      stashExperimentContextForImport()
      if (lastRunId) {
        const url = `/experiments/ui?key=${encodeURIComponent(apiKey)}&import_run=${encodeURIComponent(lastRunId)}`
        openExperimentImport(url, { importRun: lastRunId })
        return
      }
      const draft = buildExperimentImportDraft()
      sessionStorage.setItem('exp_import_draft', JSON.stringify(draft))
      openExperimentImport(
        `/experiments/ui?key=${encodeURIComponent(apiKey)}&import_draft=1`,
        { importDraft: true, draft },
      )
    }

    setupExperimentSync()
    startCamera()
    loadHistory(keyInput.value)
    loadImgList()
    loadExperimentMeta()
  </script>
</body>
</html>
