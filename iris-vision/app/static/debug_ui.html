<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iris-vision 调试台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f1419;
      color: #e6edf3;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #30363d;
      background: #161b22;
    }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; color: #8b949e; font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 340px;
      gap: 16px;
      padding: 16px;
      max-width: 1680px;
      margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 1200px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: #58a6ff;
    }
    label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 4px; }
    input[type="text"], input[type="file"] { width: 100%; margin-bottom: 10px; }
    input[type="text"] {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }
    .camera-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    video, .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    button {
      padding: 8px 14px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #21262d;
      color: #e6edf3;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: #238636; border-color: #238636; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: #c9d1d9; }
    .error {
      background: #3d1214;
      border: 1px solid #da3633;
      color: #ffa198;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .metrics-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    @media (max-width: 960px) {
      .metrics-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .metric {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 10px;
      min-width: 0;
    }
    .metric .k { font-size: 11px; color: #8b949e; }
    .metric .v {
      font-size: 15px;
      font-weight: 600;
      color: #79c0ff;
      margin-top: 2px;
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .metric .v.reason {
      font-size: 13px;
      font-weight: 500;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .grade-big {
      font-size: 42px;
      font-weight: 700;
      color: #58a6ff;
      text-align: center;
      margin: 8px 0 16px;
    }
    .stages {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .result-metrics {
      border-top: 1px solid #30363d;
      padding-top: 16px;
      margin-top: 4px;
    }
    .result-metrics .grade-big {
      margin-top: 0;
    }
    .stage {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }
    .stage h3 {
      margin: 0;
      padding: 8px 10px;
      font-size: 13px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      color: #c9d1d9;
    }
    .stage img { width: 100%; display: block; background: #000; }
    .empty { color: #8b949e; text-align: center; padding: 40px 16px; }
    .run-meta { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
    .history { margin-top: 12px; font-size: 12px; }
    .history a { color: #58a6ff; display: block; margin: 4px 0; }
    .manual-editor { margin: 0; padding: 0; border: none; }
    .manual-panel .empty { padding: 24px 12px; }
    .manual-canvas-wrap { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    #manualCanvas { width: 100%; display: block; cursor: default; touch-action: none; }
    .manual-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .manual-fields input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
    }
    .manual-hint { font-size: 12px; color: #8b949e; margin-bottom: 10px; line-height: 1.5; }
    .img-source {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }
    .img-source select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .img-path {
      font-size: 12px;
      color: #8b949e;
      word-break: break-all;
      margin-bottom: 8px;
      min-height: 18px;
    }
    .rename-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .label-actions {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #30363d;
    }
    .label-actions #btnRenameGrade {
      width: 100%;
    }
    .rename-status {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 0;
      word-break: break-all;
    }
    .rename-status.ok { color: #3fb950; }
    .rename-status.err { color: #ffa198; }
  </style>
</head>
<body>
  <header>
    <h1>iris-vision 调试台</h1>
    <p>眼部特写上传/拍照 → 查看瞳孔定位、虹膜环带、去高光、取色区域与 Lab/Grade 参数（不对接 iris-web）</p>
  </header>

  <main>
    <section class="panel">
      <h2>输入</h2>
      <label for="debugKey">Debug Key</label>
      <input id="debugKey" type="text" placeholder="iris-color-dev" />

      <div class="img-source">
        <label for="imgSelect">从 img 文件夹选择（可重命名）</label>
        <select id="imgSelect">
          <option value="">— 载入列表后选择 —</option>
        </select>
        <div class="btn-row">
          <button type="button" id="btnLoadImgList">刷新 img 列表</button>
          <button type="button" id="btnLoadImg" class="primary">载入选中图片</button>
        </div>
        <div class="img-path" id="imgPathHint">未关联 img 文件（本地上传无法重命名）</div>
      </div>

      <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview" class="preview-img" alt="预览" hidden />
      </div>
      <canvas id="canvas" hidden></canvas>

      <div class="btn-row">
        <button type="button" id="btnCapture" class="primary">拍照</button>
        <button type="button" id="btnUpload">选择文件</button>
        <input id="fileInput" type="file" accept="image/*" hidden />
        <button type="button" id="btnClear">清除</button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="skipQuality" />
        跳过质量检测（模糊/过曝，便于测试糊图）
      </label>

      <button type="button" id="btnAnalyze" class="primary" style="width:100%" disabled>
        开始识别并生成调试图
      </button>

      <div class="label-actions" id="labelActions" hidden>
        <div class="rename-row">
          <button type="button" id="btnRenameGrade" disabled>标记为 G{n}_L{L*}_</button>
        </div>
        <label class="checkbox" id="markManualRow">
          <input type="checkbox" id="markManual" />
          人工调整区域（文件名加 _M_ 标记）
        </label>
        <div class="rename-status" id="renameStatus"></div>
      </div>

      <div class="history" id="history"></div>
    </section>

    <section class="panel" id="resultPanel">
      <h2>识别结果</h2>
      <div id="placeholder" class="empty">拍照或上传后点击「开始识别」</div>
      <div id="errorBox" class="error" hidden></div>
      <div id="resultContent" hidden>
        <div class="run-meta" id="runMeta"></div>
        <div class="stages" id="stagesGrid"></div>
        <div class="result-metrics">
          <div class="grade-big" id="gradeDisplay"></div>
          <div class="metrics-summary" id="metricsSummary"></div>
          <div class="metrics" id="metricsGrid"></div>
        </div>
      </div>
    </section>

    <section class="panel manual-panel" id="manualPanel">
      <h2>人工调整</h2>
      <div id="manualPlaceholder" class="empty">识别完成后，在此拖动圆环调整取色区域</div>
      <div class="manual-editor" id="manualEditor" hidden>
        <div class="manual-hint">拖动中心移动整组圆；拖动蓝/红/绿圆边分别调整瞳孔、内环、外环。也可直接改数值。</div>
        <div class="manual-canvas-wrap">
          <canvas id="manualCanvas"></canvas>
        </div>
        <div class="manual-fields">
          <label>中心 X<input id="manualCenterX" type="number" step="1" /></label>
          <label>中心 Y<input id="manualCenterY" type="number" step="1" /></label>
          <label>瞳孔半径<input id="manualPupilRadius" type="number" step="1" min="1" /></label>
          <label>内环半径<input id="manualInnerRadius" type="number" step="1" min="1" /></label>
          <label>外环半径<input id="manualOuterRadius" type="number" step="1" min="1" /></label>
        </div>
        <button type="button" id="btnManualAnalyze" class="primary" style="width:100%">
          应用人工调整并重新识别
        </button>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search)
    const keyInput = document.getElementById('debugKey')
    keyInput.value = params.get('key') || localStorage.getItem('iris_debug_key') || 'iris-color-dev'

    const video = document.getElementById('video')
    const preview = document.getElementById('preview')
    const canvas = document.getElementById('canvas')
    const fileInput = document.getElementById('fileInput')
    const btnAnalyze = document.getElementById('btnAnalyze')
    const manualEditor = document.getElementById('manualEditor')
    const manualCanvas = document.getElementById('manualCanvas')
    const manualCtx = manualCanvas.getContext('2d')
    const manualInputs = {
      center_x: document.getElementById('manualCenterX'),
      center_y: document.getElementById('manualCenterY'),
      pupil_radius: document.getElementById('manualPupilRadius'),
      inner_radius: document.getElementById('manualInnerRadius'),
      outer_radius: document.getElementById('manualOuterRadius'),
    }
    let currentBlob = null
    let currentImgRel = null
    let lastGrade = null
    let lastMetrics = null
    let lastManualAdjusted = false
    let imgFileList = []
    let mediaStream = null
    let manualState = null
    let manualImage = new Image()
    let dragMode = null

    const STAGE_LABELS = {
      '00_original': '原图',
      '01_pupil_candidates': '瞳孔候选（黄=极暗候选区域）',
      '01_pupil_localization': '瞳孔定位（黄框=搜索区，蓝圆=瞳孔）',
      '02_iris_ring': '虹膜环带（绿=外缘，红=内缘）',
      '03_highlight_rejection': '剔除干扰（红=高光/过亮/极暗）',
      '04_valid_samples': '最终取色像素（绿=参与 Lab）',
      '05_ring_mask_only': '环带 mask 伪彩色',
    }

    async function startCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        })
        video.srcObject = mediaStream
        video.hidden = false
        preview.hidden = true
        await video.play()
      } catch (e) {
        console.warn('camera unavailable', e)
      }
    }

    function setImageBlob(blob, sourceRel = null) {
      currentBlob = blob
      currentImgRel = sourceRel
      btnAnalyze.disabled = false
      preview.src = URL.createObjectURL(blob)
      preview.hidden = false
      video.hidden = true
      updateImgPathHint()
      updateRenameButton()
    }

    function updateImgPathHint() {
      const el = document.getElementById('imgPathHint')
      if (currentImgRel) {
        el.textContent = `已关联：${currentImgRel}`
        el.style.color = '#79c0ff'
      } else {
        el.textContent = '未关联 img 文件（请从上方列表载入，本地上传无法重命名）'
        el.style.color = '#8b949e'
      }
    }

    function updateRenameButton() {
      const btn = document.getElementById('btnRenameGrade')
      const markManual = document.getElementById('markManual')
      const labelActions = document.getElementById('labelActions')
      const lStar = lastMetrics?.lab?.L
      const canRename = Boolean(currentImgRel && lastGrade >= 1 && lastGrade <= 5 && lStar != null)
      labelActions.hidden = !canRename
      btn.disabled = !canRename
      const manualPart = markManual.checked ? '_M' : ''
      btn.textContent = canRename
        ? `标记为 G${lastGrade}_L${Number(lStar).toFixed(1)}${manualPart}_`
        : '标记为 G{n}_L{L*}_'
    }

    function setManualMarkFlag(isManual) {
      lastManualAdjusted = isManual
      const markManual = document.getElementById('markManual')
      markManual.checked = isManual
      updateRenameButton()
    }

    function formatGradeDisplay(grade, lStar, isManual) {
      const manualText = isManual ? '  ·  人工调整' : ''
      return `Grade ${grade}  ·  L* ${Number(lStar ?? 0).toFixed(2)}${manualText}`
    }

    function resolveRelByFilename(filename) {
      const matches = imgFileList.filter((item) => item.name === filename)
      if (matches.length === 1) return matches[0].rel
      return null
    }

    async function loadImgList() {
      const apiKey = keyInput.value.trim()
      const select = document.getElementById('imgSelect')
      try {
        const res = await fetch('/debug/img/list', {
          headers: { 'X-Debug-Key': apiKey },
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.detail || res.statusText)
        imgFileList = data.images || []
        select.innerHTML = '<option value="">— 选择图片 —</option>' + imgFileList.map((item) => {
          const grade = item.grade_prefix ? `G${item.grade_prefix}` : ''
          const lStar = item.l_star_prefix != null ? ` L${Number(item.l_star_prefix).toFixed(1)}` : ''
          const manual = item.manual_adjusted ? ' M' : ''
          const tag = grade ? ` [${grade}${lStar}${manual}]` : ''
          return `<option value="${item.rel}">${item.rel}${tag}</option>`
        }).join('')
      } catch (err) {
        alert('载入 img 列表失败：' + (err.message || err))
      }
    }

    document.getElementById('btnLoadImgList').onclick = () => loadImgList()

    document.getElementById('btnLoadImg').onclick = async () => {
      const rel = document.getElementById('imgSelect').value
      if (!rel) return alert('请先选择一张图片')
      const apiKey = keyInput.value.trim()
      try {
        const res = await fetch(`/debug/img/file?rel=${encodeURIComponent(rel)}&key=${encodeURIComponent(apiKey)}`, {
          headers: { 'X-Debug-Key': apiKey },
        })
        if (!res.ok) {
          const data = await res.json().catch(() => ({}))
          throw new Error(data.detail || res.statusText)
        }
        const blob = await res.blob()
        setImageBlob(blob, rel)
        document.getElementById('renameStatus').textContent = ''
        document.getElementById('renameStatus').className = 'rename-status'
      } catch (err) {
        alert('载入图片失败：' + (err.message || err))
      }
    }

    document.getElementById('btnCapture').onclick = () => {
      if (!video.videoWidth) return alert('摄像头不可用，请使用选择文件')
      canvas.width = video.videoWidth
      canvas.height = video.videoHeight
      canvas.getContext('2d').drawImage(video, 0, 0)
      canvas.toBlob((blob) => blob && setImageBlob(blob, null), 'image/jpeg', 0.92)
    }

    document.getElementById('btnUpload').onclick = () => fileInput.click()
    fileInput.onchange = () => {
      const f = fileInput.files?.[0]
      if (f) {
        const rel = resolveRelByFilename(f.name)
        setImageBlob(f, rel)
        if (rel) {
          document.getElementById('imgSelect').value = rel
        }
        document.getElementById('renameStatus').textContent = ''
        document.getElementById('renameStatus').className = 'rename-status'
      }
      fileInput.value = ''
    }

    document.getElementById('btnClear').onclick = () => {
      currentBlob = null
      currentImgRel = null
      lastGrade = null
      lastMetrics = null
      lastManualAdjusted = false
      document.getElementById('markManual').checked = false
      manualState = null
      btnAnalyze.disabled = true
      setManualEditorVisible(false)
      preview.hidden = true
      video.hidden = false
      updateImgPathHint()
      updateRenameButton()
      document.getElementById('renameStatus').textContent = ''
      document.getElementById('renameStatus').className = 'rename-status'
    }

    function paramsFromMetrics(m) {
      return {
        center_x: m.pupil_center?.[0] ?? 0,
        center_y: m.pupil_center?.[1] ?? 0,
        pupil_radius: m.pupil_radius ?? 5,
        inner_radius: m.inner_radius ?? Math.max((m.pupil_radius ?? 5) * 1.2, 8),
        outer_radius: m.outer_radius ?? Math.max((m.pupil_radius ?? 5) * 2.5, 16),
      }
    }

    function syncManualInputs() {
      if (!manualState) return
      for (const [key, input] of Object.entries(manualInputs)) {
        input.value = Math.round(manualState[key])
      }
    }

    function syncManualStateFromInputs() {
      if (!manualState) return
      for (const [key, input] of Object.entries(manualInputs)) {
        manualState[key] = Number(input.value || manualState[key])
      }
      normalizeManualState()
      drawManualCanvas()
    }

    function normalizeManualState() {
      if (!manualState) return
      const minDim = Math.min(manualCanvas.width || 1, manualCanvas.height || 1)
      manualState.center_x = Math.max(0, Math.min(manualCanvas.width - 1, manualState.center_x))
      manualState.center_y = Math.max(0, Math.min(manualCanvas.height - 1, manualState.center_y))
      manualState.pupil_radius = Math.max(2, Math.min(manualState.pupil_radius, minDim * 0.45))
      manualState.inner_radius = Math.max(manualState.pupil_radius + 1, Math.min(manualState.inner_radius, minDim * 0.48))
      manualState.outer_radius = Math.max(manualState.inner_radius + 2, Math.min(manualState.outer_radius, minDim * 0.50))
      syncManualInputs()
    }

    function drawManualCanvas() {
      if (!manualState || !manualImage.complete || !manualCtx) return
      manualCtx.clearRect(0, 0, manualCanvas.width, manualCanvas.height)
      manualCtx.drawImage(manualImage, 0, 0)
      const { center_x: cx, center_y: cy, pupil_radius: pr, inner_radius: ir, outer_radius: or } = manualState
      manualCtx.lineWidth = Math.max(2, manualCanvas.width / 240)
      manualCtx.fillStyle = 'rgba(0, 255, 255, 0.18)'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, or, 0, Math.PI * 2)
      manualCtx.arc(cx, cy, ir, 0, Math.PI * 2, true)
      manualCtx.fill()
      manualCtx.strokeStyle = '#2f81f7'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, pr, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#ff4d4f'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, ir, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#3fb950'
      manualCtx.beginPath()
      manualCtx.arc(cx, cy, or, 0, Math.PI * 2)
      manualCtx.stroke()
      manualCtx.strokeStyle = '#ff4d4f'
      manualCtx.beginPath()
      manualCtx.moveTo(cx - 8, cy)
      manualCtx.lineTo(cx + 8, cy)
      manualCtx.moveTo(cx, cy - 8)
      manualCtx.lineTo(cx, cy + 8)
      manualCtx.stroke()
    }

    function canvasPoint(event) {
      const rect = manualCanvas.getBoundingClientRect()
      return {
        x: (event.clientX - rect.left) * manualCanvas.width / rect.width,
        y: (event.clientY - rect.top) * manualCanvas.height / rect.height,
      }
    }

    function hitMode(point) {
      if (!manualState) return null
      const dx = point.x - manualState.center_x
      const dy = point.y - manualState.center_y
      const dist = Math.hypot(dx, dy)
      const tol = Math.max(8, manualCanvas.width / 80)
      if (dist < tol) return 'move'
      if (Math.abs(dist - manualState.pupil_radius) < tol) return 'pupil_radius'
      if (Math.abs(dist - manualState.inner_radius) < tol) return 'inner_radius'
      if (Math.abs(dist - manualState.outer_radius) < tol) return 'outer_radius'
      return null
    }

    function updateManualCursor(event) {
      if (dragMode) {
        manualCanvas.style.cursor = 'grabbing'
        return
      }
      manualCanvas.style.cursor = hitMode(canvasPoint(event)) ? 'grab' : 'default'
    }

    function setManualEditorVisible(visible) {
      manualEditor.hidden = !visible
      document.getElementById('manualPlaceholder').hidden = visible
    }

    function setupManualEditor(metrics, originalUrl) {
      manualState = paramsFromMetrics(metrics)
      manualImage = new Image()
      manualImage.onload = () => {
        manualCanvas.width = manualImage.naturalWidth
        manualCanvas.height = manualImage.naturalHeight
        normalizeManualState()
        drawManualCanvas()
        setManualEditorVisible(true)
      }
      manualImage.src = originalUrl
    }

    for (const input of Object.values(manualInputs)) {
      input.addEventListener('change', syncManualStateFromInputs)
      input.addEventListener('input', syncManualStateFromInputs)
    }

    manualCanvas.addEventListener('pointerdown', (event) => {
      if (!manualState) return
      dragMode = hitMode(canvasPoint(event))
      if (dragMode) {
        manualCanvas.style.cursor = 'grabbing'
        manualCanvas.setPointerCapture(event.pointerId)
      }
    })

    manualCanvas.addEventListener('pointermove', (event) => {
      if (!manualState) return
      if (!dragMode) {
        updateManualCursor(event)
        return
      }
      const point = canvasPoint(event)
      if (dragMode === 'move') {
        manualState.center_x = point.x
        manualState.center_y = point.y
      } else {
        manualState[dragMode] = Math.hypot(point.x - manualState.center_x, point.y - manualState.center_y)
      }
      normalizeManualState()
      drawManualCanvas()
    })

    manualCanvas.addEventListener('pointerup', (event) => {
      dragMode = null
      updateManualCursor(event)
      try { manualCanvas.releasePointerCapture(event.pointerId) } catch (_) {}
    })

    manualCanvas.addEventListener('pointercancel', () => {
      dragMode = null
      manualCanvas.style.cursor = 'default'
    })
    manualCanvas.addEventListener('pointerleave', () => {
      if (!dragMode) manualCanvas.style.cursor = 'default'
    })

    function escapeHtml(text) {
      return String(text ?? '-')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    function metricCard(label, value, { reason = false } = {}) {
      const safeLabel = escapeHtml(label)
      const raw = value ?? '-'
      const safeValue = escapeHtml(raw)
      const title = reason && raw !== '-' ? ` title="${escapeHtml(raw)}"` : ''
      const valueClass = reason ? 'v reason' : 'v'
      return `<div class="metric"><div class="k">${safeLabel}</div><div class="${valueClass}"${title}>${safeValue}</div></div>`
    }

    function renderMetrics(m) {
      const summaryItems = [
        ['Grade', m.grade],
        ['虹膜颜色', m.iris_color?.label],
        ['颜色置信度', m.iris_color?.confidence != null ? (m.iris_color.confidence * 100).toFixed(0) + '%' : '-'],
        ['颜色依据', m.iris_color?.reason],
      ]
      const detailItems = [
        ['置信度', (m.confidence * 100).toFixed(0) + '%'],
        ['L*', m.lab?.L],
        ['a*', m.lab?.a],
        ['b*', m.lab?.b],
        ['定位方式', m.detection_method],
        ['瞳孔方法', m.pupil_method],
        ['虹膜外缘方法', m.iris_outer_method],
        ['瞳孔置信度', m.pupil_confidence?.toFixed?.(2) ?? '-'],
        ['虹膜置信度', m.iris_confidence?.toFixed?.(2) ?? '-'],
        ['候选数量', m.candidate_count],
        ['瞳孔半径', m.pupil_radius?.toFixed?.(1) ?? '-'],
        ['环带内径', m.inner_radius?.toFixed?.(1) ?? '-'],
        ['环带外径', m.outer_radius?.toFixed?.(1) ?? '-'],
        ['环带像素', m.ring_pixel_count],
        ['剔除高光', m.highlight_rejected_count],
        ['剔除过亮', m.bright_rejected_count],
        ['剔除极暗', m.dark_rejected_count],
        ['有效采样', m.valid_sample_count],
        ['清晰度', m.blur_score],
        ['过曝比', m.overexposed_ratio],
        ['高光阈值 V', m.highlight_v_threshold],
      ]
      document.getElementById('metricsSummary').innerHTML = summaryItems.map(([k, v], idx) =>
        metricCard(k, v, { reason: idx === 3 })
      ).join('')
      document.getElementById('metricsGrid').innerHTML = detailItems.map(([k, v]) =>
        metricCard(k, v)
      ).join('')
    }

    function imageSourcesFromResponse(data) {
      const sources = { ...(data.image_urls || {}) }
      for (const [key, value] of Object.entries(data.images_base64 || {})) {
        sources[key] = `data:image/jpeg;base64,${value}`
      }
      return sources
    }

    function renderStages(imageSources) {
      const order = Object.keys(STAGE_LABELS)
      document.getElementById('stagesGrid').innerHTML = order
        .filter((k) => imageSources[k])
        .map((k) => `<div class="stage"><h3>${STAGE_LABELS[k]}</h3><img src="${imageSources[k]}" alt="${k}"/></div>`)
        .join('')
    }

    async function loadHistory(apiKey) {
      try {
        const res = await fetch('/debug/runs?limit=8', { headers: { 'X-Debug-Key': apiKey } })
        const data = await res.json()
        const el = document.getElementById('history')
        if (!data.runs?.length) { el.innerHTML = ''; return }
        el.innerHTML = '<strong>最近运行：</strong>' + data.runs.map(r =>
          `<a href="${r.viewer_url}" target="_blank">${r.run_id}</a>`
        ).join('')
      } catch (_) {}
    }

    document.getElementById('btnAnalyze').onclick = async () => {
      if (!currentBlob) return
      const apiKey = keyInput.value.trim()
      localStorage.setItem('iris_debug_key', apiKey)
      const skipQ = document.getElementById('skipQuality').checked

      document.getElementById('placeholder').hidden = true
      document.getElementById('errorBox').hidden = true
      document.getElementById('resultContent').hidden = true
      btnAnalyze.disabled = true
      btnAnalyze.textContent = '识别中...'

      const form = new FormData()
      form.append('file', currentBlob, 'capture.jpg')

      try {
        const url = `/debug/analyze?skip_quality=${skipQ}&key=${encodeURIComponent(apiKey)}`
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'X-Debug-Key': apiKey },
          body: form,
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'object'
            ? JSON.stringify(data.detail, null, 2)
            : (data.detail || res.statusText))
        }

        document.getElementById('resultContent').hidden = false
        lastGrade = data.metrics.grade
        lastMetrics = data.metrics
        setManualMarkFlag(false)
        document.getElementById('gradeDisplay').textContent =
          formatGradeDisplay(data.metrics.grade, data.metrics.lab?.L, false)
        document.getElementById('runMeta').textContent =
          data.run_id
            ? `run_id: ${data.run_id} | 保存目录: ${data.saved_dir || '-'}`
            : '未保存到本地；阶段图由本次响应直接展示'
        updateRenameButton()
        const imageSources = imageSourcesFromResponse(data)
        renderMetrics(data.metrics)
        renderStages(imageSources)
        setupManualEditor(data.metrics, imageSources['00_original'])
        loadHistory(apiKey)
      } catch (err) {
        document.getElementById('errorBox').hidden = false
        document.getElementById('errorBox').textContent = String(err.message || err)
      } finally {
        btnAnalyze.disabled = false
        btnAnalyze.textContent = '开始识别并生成调试图'
      }
    }

    document.getElementById('btnManualAnalyze').onclick = async () => {
      if (!currentBlob || !manualState) return
      const apiKey = keyInput.value.trim()
      const skipQ = document.getElementById('skipQuality').checked
      const btn = document.getElementById('btnManualAnalyze')
      btn.disabled = true
      btn.textContent = '人工调整识别中...'

      const form = new FormData()
      form.append('file', currentBlob, 'manual-adjustment.jpg')
      form.append('manual_params', JSON.stringify(manualState))

      try {
        const url = `/debug/analyze/manual?skip_quality=${skipQ}&key=${encodeURIComponent(apiKey)}`
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'X-Debug-Key': apiKey },
          body: form,
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'object'
            ? JSON.stringify(data.detail, null, 2)
            : (data.detail || res.statusText))
        }
        document.getElementById('resultContent').hidden = false
        lastGrade = data.metrics.grade
        lastMetrics = data.metrics
        setManualMarkFlag(true)
        document.getElementById('gradeDisplay').textContent =
          formatGradeDisplay(data.metrics.grade, data.metrics.lab?.L, true)
        document.getElementById('runMeta').textContent =
          data.run_id
            ? `run_id: ${data.run_id} | 保存目录: ${data.saved_dir || '-'} | 人工调整`
            : '未保存到本地；阶段图由本次响应直接展示 | 人工调整'
        updateRenameButton()
        const imageSources = imageSourcesFromResponse(data)
        renderMetrics(data.metrics)
        renderStages(imageSources)
        setupManualEditor(data.metrics, imageSources['00_original'])
        loadHistory(apiKey)
      } catch (err) {
        document.getElementById('errorBox').hidden = false
        document.getElementById('errorBox').textContent = String(err.message || err)
      } finally {
        btn.disabled = false
        btn.textContent = '应用人工调整并重新识别'
      }
    }

    document.getElementById('btnRenameGrade').onclick = async () => {
      if (!currentImgRel || !lastGrade || lastMetrics?.lab?.L == null) return
      const apiKey = keyInput.value.trim()
      const btn = document.getElementById('btnRenameGrade')
      const statusEl = document.getElementById('renameStatus')
      const oldRel = currentImgRel
      btn.disabled = true
      statusEl.textContent = '标记中...'
      statusEl.className = 'rename-status'

      try {
        const res = await fetch(`/debug/rename-grade?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: {
            'X-Debug-Key': apiKey,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            rel: currentImgRel,
            grade: lastGrade,
            lab: lastMetrics.lab,
            iris_color: lastMetrics.iris_color,
            confidence: lastMetrics.confidence,
            manual_adjusted: document.getElementById('markManual').checked,
          }),
        })
        const data = await res.json()
        if (!res.ok) {
          throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail))
        }
        currentImgRel = data.new_rel
        document.getElementById('imgSelect').value = data.new_rel
        updateImgPathHint()
        const lText = data.l_star != null ? `，L*=${Number(data.l_star).toFixed(2)}` : ''
        const mText = data.manual_adjusted ? '，人工调整' : ''
        statusEl.textContent = `已标记：${oldRel} → ${data.new_rel}${lText}${mText}（索引已写入 labels/img_labels.json）`
        statusEl.className = 'rename-status ok'
        await loadImgList()
        document.getElementById('imgSelect').value = data.new_rel
      } catch (err) {
        statusEl.textContent = '标记失败：' + (err.message || err)
        statusEl.className = 'rename-status err'
      } finally {
        updateRenameButton()
      }
    }

    document.getElementById('markManual').addEventListener('change', updateRenameButton)

    startCamera()
    loadHistory(keyInput.value)
    loadImgList()
  </script>
</body>
</html>
