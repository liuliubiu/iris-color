<script>
(function () {
  if (typeof Vue === 'undefined' || typeof ElementPlus === 'undefined') {
    document.getElementById('app').innerHTML = '<div class="load-error"><p>Vue / Element Plus 加载失败。</p></div>';
    return;
  }

  const { createApp, ref, reactive, computed, watch, onMounted, nextTick, onBeforeUnmount } = Vue;
  const { ElMessage, ElMessageBox } = ElementPlus;

  const GRADES = ['Grade1','Grade2','Grade3','Grade4','Grade5'];
  const COLORS = ['浅蓝','蓝','深蓝','浅绿','绿','深绿','浅棕','棕','深棕'];
  const GROUP_RE = /^第.+大组$|^G\d{8}-\d{3}$/;
  const SUBGROUP_RE = /^第.+小组$|^S\d{2}$/i;
  const EMPTY_MARK = '__EMPTY__';
  const NUM_FIELDS = new Set(['id', 'illuminance', 'lstar_before', 'lstar_after']);
  const GRADE_FIELDS = new Set(['grade_before', 'grade_after']);
  const BOOL_FIELDS = new Set(['skip_quality', 'manual_adjusted', 'include_in_stats']);

  function displayFilterValue(row, field) {
    const val = row[field];
    if (field === 'include_in_stats') return (val !== false) ? '是' : '否';
    if (BOOL_FIELDS.has(field)) return val ? '是' : '否';
    return (val === null || val === undefined || val === '') ? EMPTY_MARK : String(val);
  }
  const DEFAULT_SORT = { prop: 'id', order: 'descending' };
  const STAT_DIM_OPTIONS = [
    { field: 'group_name', label: '实验大组' },
    { field: 'subgroup_name', label: '实验小组' },
    { field: 'operator', label: '实验人' },
    { field: 'camera_device', label: '拍摄设备' },
    { field: 'light_device', label: '灯光设备' },
  ];
  const DEFAULT_STAT_GROUP_BY = ['group_name', 'subgroup_name'];

  function emptyGradeCounts() {
    return Object.fromEntries(GRADES.map(g => [g, 0]));
  }

  function isIncludedInStats(row) {
    return row && row.include_in_stats !== false;
  }

  function recordsForStats(records) {
    return (records || []).filter(isIncludedInStats);
  }

  function normalizeGradeValue(val) {
    if (val == null || val === '') return null;
    const s = String(val).trim();
    if (GRADES.includes(s)) return s;
    const m = s.match(/(\d)/);
    return m ? 'Grade' + m[1] : null;
  }

  function computeGradeStats(records, groupByFields) {
    const buckets = new Map();
    const totals = { total: 0, before: emptyGradeCounts(), after: emptyGradeCounts() };
    for (const rec of records) {
      const key = groupByFields.map(f => rec[f] ?? '').join('\0');
      if (!buckets.has(key)) {
        const row = { total: 0, before: emptyGradeCounts(), after: emptyGradeCounts() };
        groupByFields.forEach(f => { row[f] = rec[f] ?? ''; });
        buckets.set(key, row);
      }
      const row = buckets.get(key);
      row.total += 1;
      totals.total += 1;
      const gb = normalizeGradeValue(rec.grade_before);
      const ga = normalizeGradeValue(rec.grade_after);
      if (gb) { row.before[gb] += 1; totals.before[gb] += 1; }
      if (ga) { row.after[ga] += 1; totals.after[ga] += 1; }
    }
    const rows = [...buckets.values()].sort((a, b) => {
      for (const f of groupByFields) {
        const cmp = String(a[f] || '').localeCompare(String(b[f] || ''), 'zh-CN');
        if (cmp) return cmp;
      }
      return 0;
    });
    return { rows, totals };
  }

  function compareField(a, b, prop) {
    let va = a[prop], vb = b[prop];
    const emptyA = va == null || va === '';
    const emptyB = vb == null || vb === '';
    if (emptyA && emptyB) return 0;
    if (emptyA) return 1;
    if (emptyB) return -1;
    if (NUM_FIELDS.has(prop)) {
      return (Number(va) || 0) - (Number(vb) || 0);
    }
    if (GRADE_FIELDS.has(prop)) {
      const ga = parseInt(String(va).replace(/\D/g, ''), 10) || 0;
      const gb = parseInt(String(vb).replace(/\D/g, ''), 10) || 0;
      return ga - gb;
    }
    if (BOOL_FIELDS.has(prop)) {
      return Number(!!va) - Number(!!vb);
    }
    if (prop === 'experiment_date') {
      return String(va).localeCompare(String(vb));
    }
    return String(va).localeCompare(String(vb), 'zh-CN');
  }

  /* ---- FilterHeader 组件（对齐 business SmartTable/FilterHeader） ---- */
  const ExpFilterHeader = {
    name: 'ExpFilterHeader',
    props: {
      title: String,
      field: String,
      type: { type: String, default: 'text' },
      fixedOptions: { type: Array, default: null },
      currentSort: Object,
      columnFilters: Object,
      allRecords: Array,
    },
    emits: ['sort-change', 'filter-change'],
    setup(props, { emit }) {
      const visible = ref(false);
      const searchText = ref('');
      const selectedValues = ref([]);
      const draftSelected = ref([]);

      const isActive = computed(() => {
        const f = props.columnFilters[props.field];
        return (f && f.selected && f.selected.length > 0) || (props.currentSort && props.currentSort.prop === props.field);
      });
      const isAsc = computed(() => props.currentSort?.prop === props.field && props.currentSort?.order === 'ascending');
      const isDesc = computed(() => props.currentSort?.prop === props.field && props.currentSort?.order === 'descending');

      function cellVal(row) {
        return displayFilterValue(row, props.field);
      }

      function recordsForOptions() {
        const filters = props.columnFilters || {};
        return (props.allRecords || []).filter(row => {
          for (const [key, f] of Object.entries(filters)) {
            if (key === props.field || !f?.selected?.length) continue;
            if (!f.selected.includes(displayFilterValue(row, key))) return false;
          }
          return true;
        });
      }

      const optionList = computed(() => {
        if (props.fixedOptions?.length) {
          return props.fixedOptions.map(v => ({ label: String(v), value: String(v) }));
        }
        const set = new Set();
        recordsForOptions().forEach(row => set.add(cellVal(row)));
        const arr = Array.from(set).map(v => ({
          label: v === EMPTY_MARK ? '（空）' : v,
          value: v,
        }));
        if (props.type === 'number') {
          return arr.sort((a, b) => {
            if (a.value === EMPTY_MARK) return 1;
            if (b.value === EMPTY_MARK) return -1;
            return Number(a.value) - Number(b.value);
          });
        }
        return arr.sort((a, b) => a.label.localeCompare(b.label, 'zh-CN'));
      });

      const filteredOptions = computed(() => {
        if (!searchText.value) return optionList.value;
        const q = searchText.value.toLowerCase();
        return optionList.value.filter(o => o.label.toLowerCase().includes(q));
      });

      const isAllSelected = computed(() =>
        filteredOptions.value.length > 0 && filteredOptions.value.every(o => draftSelected.value.includes(o.value))
      );
      const isIndeterminate = computed(() => {
        const n = filteredOptions.value.filter(o => draftSelected.value.includes(o.value)).length;
        return n > 0 && n < filteredOptions.value.length;
      });

      function onShow() {
        const f = props.columnFilters[props.field];
        draftSelected.value = f?.selected ? [...f.selected] : [];
        searchText.value = f?.keyword || '';
      }

      function applySort(order) {
        emit('sort-change', props.field, order);
        visible.value = false;
      }

      function toggleAll(checked) {
        const vals = filteredOptions.value.map(o => o.value);
        if (checked) {
          draftSelected.value = [...new Set([...draftSelected.value, ...vals])];
        } else {
          draftSelected.value = draftSelected.value.filter(v => !vals.includes(v));
        }
      }

      function toggleOption(value, checked) {
        if (checked) {
          if (!draftSelected.value.includes(value)) draftSelected.value.push(value);
        } else {
          draftSelected.value = draftSelected.value.filter(v => v !== value);
        }
      }

      function handleClear() {
        draftSelected.value = [];
        searchText.value = '';
        emit('filter-change', props.field, { selected: [], keyword: '' });
        visible.value = false;
      }

      function handleConfirm() {
        emit('filter-change', props.field, { selected: [...draftSelected.value], keyword: searchText.value });
        visible.value = false;
      }

      return {
        visible, searchText, draftSelected, isActive, isAsc, isDesc,
        filteredOptions, isAllSelected, isIndeterminate,
        onShow, applySort, toggleAll, toggleOption, handleClear, handleConfirm,
      };
    },
    template: `
      <div class="fh-wrap" @click.stop>
        <span class="fh-title" :title="title">{{ title }}</span>
        <el-popover placement="bottom" :width="260" trigger="click" v-model:visible="visible" @show="onShow">
          <template #reference>
            <button type="button" class="fh-btn" :class="{ active: isActive }" title="筛选">&#9660;</button>
          </template>
          <div class="fh-pop-body">
            <div class="fh-sort-row">
              <el-button size="small" :type="isAsc ? 'primary' : ''" @click="applySort('ascending')">&#8593; 升序</el-button>
              <el-button size="small" :type="isDesc ? 'primary' : ''" @click="applySort('descending')">&#8595; 降序</el-button>
            </div>
            <el-input v-model="searchText" placeholder="搜索..." size="small" clearable />
            <div class="fh-list">
              <el-checkbox v-if="filteredOptions.length" :model-value="isAllSelected" :indeterminate="isIndeterminate" @change="toggleAll">全选</el-checkbox>
              <el-checkbox v-for="opt in filteredOptions" :key="opt.value"
                :model-value="draftSelected.includes(opt.value)"
                @change="(c) => toggleOption(opt.value, c)">
                {{ opt.label }}
              </el-checkbox>
              <div v-if="!filteredOptions.length" style="text-align:center;color:#c0c4cc;font-size:12px;padding:8px">无匹配项</div>
            </div>
            <div class="fh-actions">
              <el-button type="primary" link size="small" @click="handleClear">清空</el-button>
              <el-button type="primary" size="small" @click="handleConfirm">确定</el-button>
            </div>
          </div>
        </el-popover>
      </div>
    `,
  };

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function emptyForm() {
    return {
      group_name:'', subgroup_name:'', experiment_date:todayStr(), operator:'', camera_device:'', light_device:'',
      illuminance:undefined, color:'', grade_before:'', lstar_before:undefined, grade_after:'', lstar_after:undefined,
      skip_quality:false, manual_adjusted:false, include_in_stats:true,
      notes:'', image_rel:'', debug_run_id:'',
    };
  }

  const app = createApp({
    components: { ExpFilterHeader },
    setup() {
      const libsReady = ref(true);
      const params = new URLSearchParams(location.search);
      const apiKey = ref(localStorage.getItem('exp_api_key') || params.get('key') || 'iris-color-dev');
      const allRecords = ref([]);
      const loading = ref(false);
      const saving = ref(false);
      const selectedIds = ref([]);
      const drawerVisible = ref(false);
      const editingId = ref(null);
      const formRef = ref(null);
      const tableRef = ref(null);
      const form = reactive(emptyForm());
      const distinct = reactive({ operator:[], camera_device:[], light_device:[] });
      const globalSearch = ref('');
      const columnFilters = reactive({});
      const sortState = reactive({ prop: DEFAULT_SORT.prop, order: DEFAULT_SORT.order });
      const pageSize = ref(50);
      const displayLimit = ref(50);
      const importDialogVisible = ref(false);
      const importLoading = ref(false);
      const debugRuns = ref([]);
      const importPreview = reactive({ thumb_url: '', before_url: '', after_url: '', compare_url: '', summary: '' });
      const compareDialogVisible = ref(false);
      const compareLoading = ref(false);
      const compareLoadingId = ref(null);
      const includeStatsSavingId = ref(null);
      const compareDialog = reactive({
        before_url: '', after_url: '', compare_url: '',
        grade_before: '', grade_after: '', lstar_before: null, lstar_after: null, image_rel: '',
        audit: null,
      });
      const recognizeDialogVisible = ref(false);
      const recognizeLoading = ref(false);
      const recognizeApplying = ref(false);
      const recognizeTarget = ref(null);
      const recognizePreview = ref(null);
      const recognizeSkipQuality = ref(false);
      const recognizeOverwriteRecord = ref(true);
      const recognizeOverwriteSnapshots = ref(true);
      const recognizeCanvasRef = ref(null);
      const recognizeOverlayUrl = ref('');
      let recognizeManualState = null;
      let recognizeManualImage = null;
      let recognizeManualCtx = null;
      let recognizeDragMode = null;
      const recognizeManualReady = ref(false);
      const recognizeLastManual = ref(false);
      const statsDialogVisible = ref(false);
      const statsMainTab = ref('count');
      const statsGroupBy = ref([...DEFAULT_STAT_GROUP_BY]);
      const statsRows = ref([]);
      const statsTotals = reactive({ total: 0, before: emptyGradeCounts(), after: emptyGradeCounts() });
      const statsPctOperators = ref([]);
      const statsPctGroups = ref([]);
      const statsPctSubgroups = ref([]);
      const statsPctByOperator = ref(false);
      const statsPctRows = ref([]);
      const statsPctTotals = reactive({ total: 0, before: emptyGradeCounts(), after: emptyGradeCounts() });
      const stabilityDialogVisible = ref(false);
      const stabilityLoading = ref(false);
      const stabilityMinN = ref(3);
      const stabilityOperators = ref([]);
      const stabilityGroups = ref([]);
      const stabilitySubgroups = ref([]);
      const stabilityTab = ref('scatter');
      const stabilityReport = reactive({});
      const stabilityScatterSummary = reactive({ n: 0, stdBefore: '—', stdAfter: '—' });
      const chartScatterRef = ref(null);
      const chartWithinRef = ref(null);
      const chartPersonRef = ref(null);
      const chartCrossRef = ref(null);
      const chartBoundaryRef = ref(null);
      const chartGradeBeforeRef = ref(null);
      const chartGradeAfterRef = ref(null);
      const chartInstances = {};
      let skipSubgroupDefaults = false;

      const statDimOptions = STAT_DIM_OPTIONS;
      const activeStatDims = computed(() =>
        STAT_DIM_OPTIONS.filter(d => statsGroupBy.value.includes(d.field))
      );

      const stabilityOperatorOptions = computed(() =>
        [...new Set(allRecords.value.map(r => r.operator).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'))
      );
      const stabilityGroupOptions = computed(() =>
        [...new Set(allRecords.value.map(r => r.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'))
      );
      const stabilitySubgroupOptions = computed(() => {
        let src = allRecords.value;
        if (stabilityGroups.value.length) {
          const set = new Set(stabilityGroups.value);
          src = src.filter(r => set.has(r.group_name));
        }
        return [...new Set(src.map(r => r.subgroup_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      });

      const statsPctOperatorOptions = computed(() =>
        [...new Set(allRecords.value.map(r => r.operator).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'))
      );
      const statsPctGroupOptions = computed(() =>
        [...new Set(allRecords.value.map(r => r.group_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'))
      );
      const statsPctSubgroupOptions = computed(() => {
        let src = allRecords.value;
        if (statsPctGroups.value.length) {
          const set = new Set(statsPctGroups.value);
          src = src.filter(r => set.has(r.group_name));
        }
        return [...new Set(src.map(r => r.subgroup_name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      });

      const debugUiUrl = computed(() => '/debug/ui?key=' + encodeURIComponent(apiKey.value));

      const gradeOptions = GRADES;
      const colorOptions = COLORS;
      const boolOptions = ['是', '否'];
      const blueColors = ['浅蓝','蓝','深蓝'];
      const greenColors = ['浅绿','绿','深绿'];
      const brownColors = ['浅棕','棕','深棕'];

      const formRules = {
        group_name: [{ required:true, message:'请填写实验大组', trigger:'blur' }, { pattern:GROUP_RE, message:'格式：第一大组、第二大组…', trigger:'blur' }],
        subgroup_name: [{ validator:(_,v,cb)=>{ if(!v||SUBGROUP_RE.test(String(v).trim())) cb(); else cb(new Error('格式：第一小组，或留空')); }, trigger:'blur' }],
        experiment_date: [{ required:true, message:'请选择日期', trigger:'change' }],
        operator: [{ required:true, message:'请填写实验人', trigger:'blur' }],
      };

      watch(apiKey, v => localStorage.setItem('exp_api_key', v));

      const drawerTitle = computed(() => editingId.value ? '编辑记录 #' + editingId.value : '新建记录');

      const formRowForCompare = computed(() => ({
        id: editingId.value,
        image_rel: form.image_rel,
        debug_run_id: form.debug_run_id,
        image_before_rel: null,
        image_after_rel: null,
        grade_before: form.grade_before,
        grade_after: form.grade_after,
        lstar_before: form.lstar_before,
        lstar_after: form.lstar_after,
      }));

      const hasActiveFilters = computed(() => {
        if (globalSearch.value.trim()) return true;
        return Object.values(columnFilters).some(f => f?.selected?.length > 0 || (f?.keyword && String(f.keyword).trim()));
      });

      const hasActiveSort = computed(() =>
        sortState.prop !== DEFAULT_SORT.prop || sortState.order !== DEFAULT_SORT.order
      );

      function rowMatchesFilters(row) {
        for (const [field, f] of Object.entries(columnFilters)) {
          const s = displayFilterValue(row, field);
          if (f?.selected?.length && !f.selected.includes(s)) return false;
          if (f?.keyword && String(f.keyword).trim()) {
            const label = s === EMPTY_MARK ? '' : s;
            if (!label.toLowerCase().includes(String(f.keyword).trim().toLowerCase())) return false;
          }
        }
        if (globalSearch.value.trim()) {
          const q = globalSearch.value.trim().toLowerCase();
          const hay = Object.values(row).filter(v => v != null).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }

      const filteredRecords = computed(() => {
        let list = allRecords.value.filter(rowMatchesFilters);
        const { prop, order } = sortState;
        if (prop && order) {
          const dir = order === 'ascending' ? 1 : -1;
          list = [...list].sort((a, b) => compareField(a, b, prop) * dir);
        }
        return list;
      });

      const pagedRecords = computed(() => filteredRecords.value.slice(0, displayLimit.value));
      const canLoadMore = computed(() => displayLimit.value < filteredRecords.value.length);

      function onHeaderSort(field, order) {
        sortState.prop = field;
        sortState.order = order;
        displayLimit.value = pageSize.value;
      }
      function onHeaderFilter(field, payload) {
        columnFilters[field] = payload;
        displayLimit.value = pageSize.value;
      }
      function resetAllFilters() {
        Object.keys(columnFilters).forEach(k => delete columnFilters[k]);
        globalSearch.value = '';
        sortState.prop = DEFAULT_SORT.prop;
        sortState.order = DEFAULT_SORT.order;
        displayLimit.value = pageSize.value;
      }
      function loadMore() {
        displayLimit.value = Math.min(displayLimit.value + pageSize.value, filteredRecords.value.length);
      }
      function onPageSizeChange() {
        displayLimit.value = pageSize.value;
      }

      function gradeShort(g) {
        return String(g).replace('Grade', 'G');
      }

      function gradeCountSum(counts) {
        return GRADES.reduce((sum, g) => sum + (counts[g] || 0), 0);
      }

      function formatStatDim(val) {
        return val == null || val === '' ? '—' : val;
      }

      function gradePct(counts, grade) {
        const n = counts[grade] || 0;
        const total = gradeCountSum(counts);
        if (!total || !n) return '0.0%';
        return (100 * n / total).toFixed(1) + '%';
      }

      function formatGradePctOnly(counts, grade) {
        const n = counts[grade] || 0;
        if (!n) return '—';
        return gradePct(counts, grade);
      }

      function aggregateGradeCounts(records) {
        const before = emptyGradeCounts();
        const after = emptyGradeCounts();
        let total = 0;
        for (const rec of records) {
          total += 1;
          const gb = normalizeGradeValue(rec.grade_before);
          const ga = normalizeGradeValue(rec.grade_after);
          if (gb) before[gb] += 1;
          if (ga) after[ga] += 1;
        }
        return { total, before, after };
      }

      function refreshGradeStats() {
        if (!statsGroupBy.value.length) {
          statsRows.value = [];
          statsTotals.total = 0;
          Object.assign(statsTotals.before, emptyGradeCounts());
          Object.assign(statsTotals.after, emptyGradeCounts());
          ElMessage.warning('请至少选择一个分组维度');
          return;
        }
        const { rows, totals } = computeGradeStats(recordsForStats(filteredRecords.value), [...statsGroupBy.value]);
        statsRows.value = rows;
        statsTotals.total = totals.total;
        Object.assign(statsTotals.before, totals.before);
        Object.assign(statsTotals.after, totals.after);
      }

      function statsPctScopeRecords() {
        let list = recordsForStats(allRecords.value);
        if (statsPctOperators.value.length) {
          const set = new Set(statsPctOperators.value);
          list = list.filter(r => set.has(r.operator));
        }
        if (statsPctGroups.value.length) {
          const set = new Set(statsPctGroups.value);
          list = list.filter(r => set.has(r.group_name));
        }
        if (statsPctSubgroups.value.length) {
          const set = new Set(statsPctSubgroups.value);
          list = list.filter(r => set.has(r.subgroup_name));
        }
        return list;
      }

      function buildStatsPctScopeLabel() {
        const parts = [];
        if (statsPctOperators.value.length) parts.push(statsPctOperators.value.join('、'));
        if (statsPctGroups.value.length) parts.push(statsPctGroups.value.join('、'));
        if (statsPctSubgroups.value.length) parts.push(statsPctSubgroups.value.join('、'));
        return parts.length ? parts.join(' · ') : '全部记录';
      }

      function onStatsPctGroupChange() {
        const allowed = new Set(statsPctSubgroupOptions.value);
        statsPctSubgroups.value = statsPctSubgroups.value.filter(s => allowed.has(s));
      }

      function refreshGradePctStats() {
        const records = statsPctScopeRecords();
        if (!records.length) {
          statsPctRows.value = [];
          statsPctTotals.total = 0;
          Object.assign(statsPctTotals.before, emptyGradeCounts());
          Object.assign(statsPctTotals.after, emptyGradeCounts());
          renderGradePctCharts();
          ElMessage.warning('当前筛选范围内无记录');
          return;
        }
        if (statsPctByOperator.value) {
          const ops = [...new Set(records.map(r => r.operator).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
          statsPctRows.value = ops.map(op => {
            const sub = records.filter(r => r.operator === op);
            const agg = aggregateGradeCounts(sub);
            return { label: op, total: agg.total, before: agg.before, after: agg.after };
          });
        } else {
          const agg = aggregateGradeCounts(records);
          statsPctRows.value = [{ label: buildStatsPctScopeLabel(), total: agg.total, before: agg.before, after: agg.after }];
        }
        const totals = aggregateGradeCounts(records);
        statsPctTotals.total = totals.total;
        Object.assign(statsPctTotals.before, totals.before);
        Object.assign(statsPctTotals.after, totals.after);
        nextTick(() => renderGradePctCharts());
      }

      function gradePieOption(title, counts) {
        const data = GRADES.map(g => ({ name: gradeShort(g), value: counts[g] || 0 }))
          .filter(d => d.value > 0);
        return {
          title: { text: title, left: 'center', textStyle: { fontSize: 13, fontWeight: 600 } },
          tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
          legend: { orient: 'vertical', left: 'left', top: 'middle', textStyle: { fontSize: 11 } },
          series: [{
            type: 'pie',
            radius: ['36%', '62%'],
            center: ['58%', '52%'],
            data,
            label: { formatter: '{b}\n{d}%', fontSize: 11 },
          }],
        };
      }

      function renderGradePctCharts() {
        if (!statsDialogVisible.value || statsMainTab.value !== 'pct' || typeof echarts === 'undefined') return;
        nextTick(() => {
          const titleSuffix = statsPctTotals.total ? `（${buildStatsPctScopeLabel()}，n=${statsPctTotals.total}）` : '';
          if (chartGradeBeforeRef.value && statsPctTotals.total) {
            const ch = getChart('grade-before', chartGradeBeforeRef.value);
            ch?.setOption(gradePieOption('调色前 Grade 占比' + titleSuffix, statsPctTotals.before), true);
          } else {
            try { chartInstances['grade-before']?.dispose(); } catch (_) {}
            delete chartInstances['grade-before'];
          }
          if (chartGradeAfterRef.value && statsPctTotals.total) {
            const ch = getChart('grade-after', chartGradeAfterRef.value);
            ch?.setOption(gradePieOption('调色后 Grade 占比' + titleSuffix, statsPctTotals.after), true);
          } else {
            try { chartInstances['grade-after']?.dispose(); } catch (_) {}
            delete chartInstances['grade-after'];
          }
        });
      }

      function onStatsTabChange(tab) {
        if (tab === 'pct') refreshGradePctStats();
      }

      function onStatsDialogOpened() {
        if (statsMainTab.value === 'pct') refreshGradePctStats();
      }

      function openGradeStats() {
        if (!statsGroupBy.value.length) statsGroupBy.value = [...DEFAULT_STAT_GROUP_BY];
        statsMainTab.value = 'count';
        refreshGradeStats();
        statsDialogVisible.value = true;
      }

      function stabilityScopeRecords() {
        let list = recordsForStats(allRecords.value).filter(r => r.lstar_before != null && r.lstar_after != null);
        if (stabilityOperators.value.length) {
          const set = new Set(stabilityOperators.value);
          list = list.filter(r => set.has(r.operator));
        }
        if (stabilityGroups.value.length) {
          const set = new Set(stabilityGroups.value);
          list = list.filter(r => set.has(r.group_name));
        }
        if (stabilitySubgroups.value.length) {
          const set = new Set(stabilitySubgroups.value);
          list = list.filter(r => set.has(r.subgroup_name));
        }
        return list;
      }

      function computeLstarDispersion(records) {
        const b = records.map(r => Number(r.lstar_before));
        const a = records.map(r => Number(r.lstar_after));
        function std(arr) {
          if (arr.length < 2) return 0;
          const m = arr.reduce((s, v) => s + v, 0) / arr.length;
          return Math.sqrt(arr.reduce((s, v) => s + (v - m) ** 2, 0) / (arr.length - 1));
        }
        return {
          n: records.length,
          stdBefore: std(b).toFixed(2),
          stdAfter: std(a).toFixed(2),
        };
      }

      function onStabilityGroupChange() {
        const allowed = new Set(stabilitySubgroupOptions.value);
        stabilitySubgroups.value = stabilitySubgroups.value.filter(s => allowed.has(s));
      }

      function renderLstarDensityChart() {
        const records = stabilityScopeRecords();
        Object.assign(stabilityScatterSummary, computeLstarDispersion(records));
        const ch = getChart('scatter', chartScatterRef.value);
        if (!ch) return;
        if (!records.length) {
          ch.clear();
          return;
        }
        const beforeVals = records.map(r => Number(r.lstar_before));
        const afterVals = records.map(r => Number(r.lstar_after));
        const allVals = [...beforeVals, ...afterVals];
        const minL = Math.floor(Math.min(...allVals) - 2);
        const maxL = Math.ceil(Math.max(...allVals) + 2);
        const span = maxL - minL || 1;
        const binCount = Math.min(24, Math.max(10, Math.ceil(Math.sqrt(records.length * 2))));
        const binWidth = span / binCount;

        function histCounts(vals) {
          const counts = Array(binCount).fill(0);
          vals.forEach(v => {
            let i = Math.floor((v - minL) / binWidth);
            if (i >= binCount) i = binCount - 1;
            if (i < 0) i = 0;
            counts[i] += 1;
          });
          return counts;
        }

        const binLabels = Array.from({ length: binCount }, (_, i) => {
          const lo = minL + i * binWidth;
          const hi = lo + binWidth;
          return `${lo.toFixed(0)}–${hi.toFixed(0)}`;
        });

        function stripPoints(vals, xCenter) {
          return vals.map((y, i) => [xCenter + (((i * 0.6180339887) % 1) - 0.5) * 0.32, y]);
        }

        const stdB = Number(stabilityScatterSummary.stdBefore);
        const stdA = Number(stabilityScatterSummary.stdAfter);

        ch.setOption({
          title: {
            text: `L* 密集度对比（调色前 σ=${stdB}，调色后 σ=${stdA}${stdA < stdB ? '，调色后更集中' : stdA > stdB ? '，调色后更分散' : ''}）`,
            left: 'center',
            textStyle: { fontSize: 13, fontWeight: 600 },
          },
          tooltip: {
            trigger: 'item',
            formatter(p) {
              if (p.seriesType === 'bar') {
                return `${p.seriesName}<br/>L* ${p.name}<br/>频数 ${p.value}`;
              }
              const phase = p.seriesName;
              return `${phase}<br/>L* ${Number(p.value[1]).toFixed(2)}`;
            },
          },
          legend: { data: ['调色前', '调色后'], top: 28 },
          grid: [
            { left: 56, right: 24, top: 56, height: '38%' },
            { left: 56, right: 24, top: '62%', height: '30%' },
          ],
          xAxis: [
            { type: 'category', data: binLabels, gridIndex: 0, axisLabel: { rotate: binCount > 14 ? 40 : 0, fontSize: 10, interval: Math.max(0, Math.floor(binCount / 12)) } },
            {
              type: 'value', min: -0.55, max: 1.55, gridIndex: 1, splitLine: { show: false },
              axisTick: { show: false },
              axisLabel: {
                formatter(v) {
                  if (Math.abs(v - 0) < 0.01) return '调色前';
                  if (Math.abs(v - 1) < 0.01) return '调色后';
                  return '';
                },
                fontSize: 12,
              },
            },
          ],
          yAxis: [
            { type: 'value', name: '频数', gridIndex: 0, minInterval: 1 },
            { type: 'value', name: 'L*', gridIndex: 1, min: minL, max: maxL, splitLine: { lineStyle: { type: 'dashed' } } },
          ],
          series: [
            { name: '调色前', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, data: histCounts(beforeVals), itemStyle: { color: 'rgba(148,163,184,0.85)' }, barGap: 0 },
            { name: '调色后', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, data: histCounts(afterVals), itemStyle: { color: 'rgba(59,130,246,0.85)' } },
            { name: '调色前', type: 'scatter', xAxisIndex: 1, yAxisIndex: 1, data: stripPoints(beforeVals, 0), symbolSize: 9, itemStyle: { opacity: 0.55, color: '#94a3b8' } },
            { name: '调色后', type: 'scatter', xAxisIndex: 1, yAxisIndex: 1, data: stripPoints(afterVals, 1), symbolSize: 9, itemStyle: { opacity: 0.55, color: '#3b82f6' } },
          ],
        }, true);
      }

      const STABILITY_CHART_KEYS = ['scatter', 'within', 'person', 'cross', 'boundary'];

      function disposeStabilityCharts() {
        STABILITY_CHART_KEYS.forEach(k => {
          try { chartInstances[k]?.dispose(); } catch (_) {}
          delete chartInstances[k];
        });
      }

      function getChart(key, el) {
        if (!el || typeof echarts === 'undefined') return null;
        if (chartInstances[key]) {
          chartInstances[key].dispose();
          delete chartInstances[key];
        }
        const inst = echarts.init(el);
        chartInstances[key] = inst;
        return inst;
      }

      function barPairOption(title, labels, before, after, yName) {
        return {
          title: { text: title, left: 'center', textStyle: { fontSize: 13, fontWeight: 600 } },
          tooltip: { trigger: 'axis' },
          legend: { data: ['调色前', '调色后'], top: 28 },
          grid: { left: 48, right: 16, top: 64, bottom: labels.length > 8 ? 72 : 48 },
          xAxis: {
            type: 'category',
            data: labels,
            axisLabel: { rotate: labels.length > 6 ? 35 : 0, fontSize: 11, interval: 0 },
          },
          yAxis: { type: 'value', name: yName, nameTextStyle: { fontSize: 11 } },
          series: [
            { name: '调色前', type: 'bar', data: before, itemStyle: { color: '#94a3b8' } },
            { name: '调色后', type: 'bar', data: after, itemStyle: { color: '#3b82f6' } },
          ],
        };
      }

      function renderStabilityCharts() {
        if (!stabilityDialogVisible.value || typeof echarts === 'undefined') return;
        nextTick(() => {
          if (stabilityTab.value === 'scatter') {
            renderLstarDensityChart();
            return;
          }
          const ws = stabilityReport.within_subgroup || {};
          const groups = ws.groups || [];
          if (stabilityTab.value === 'within' && chartWithinRef.value) {
            const ch = getChart('within', chartWithinRef.value);
            if (!ch) return;
            if (!groups.length) {
              ch.clear();
              return;
            }
            const labels = groups.map(g => `${g.operator}·${g.group}-${g.subgroup || '-'}\n${g.camera || ''}`);
            ch.setOption(barPairOption(
              `小组内 L* 标准差 σ（n≥${stabilityMinN.value}）`,
              labels,
              groups.map(g => g.std_before),
              groups.map(g => g.std_after),
              'σ (L*)'
            ), true);
          }
          if (stabilityTab.value === 'person' && chartPersonRef.value) {
            const people = stabilityReport.per_person || [];
            const ch = getChart('person', chartPersonRef.value);
            if (!ch) return;
            if (!people.length) { ch.clear(); return; }
            ch.setOption({
              ...barPairOption(
                '同人跨条件总离散度 σ',
                people.map(p => p.operator),
                people.map(p => p.std_before),
                people.map(p => p.std_after),
                'σ (L*)'
              ),
              series: [
                { name: '调色前 σ', type: 'bar', data: people.map(p => p.std_before), itemStyle: { color: '#94a3b8' } },
                { name: '调色后 σ', type: 'bar', data: people.map(p => p.std_after), itemStyle: { color: '#3b82f6' } },
                { name: '调色前 条件间', type: 'line', data: people.map(p => p.between_cond_std_before), itemStyle: { color: '#f59e0b' }, lineStyle: { type: 'dashed' } },
                { name: '调色后 条件间', type: 'line', data: people.map(p => p.between_cond_std_after), itemStyle: { color: '#ef4444' }, lineStyle: { type: 'dashed' } },
              ],
              legend: { data: ['调色前 σ', '调色后 σ', '调色前 条件间', '调色后 条件间'], top: 28 },
            }, true);
          }
          if (stabilityTab.value === 'cross' && chartCrossRef.value) {
            const cross = stabilityReport.cross_condition || [];
            const ch = getChart('cross', chartCrossRef.value);
            if (!ch) return;
            if (!cross.length) { ch.clear(); return; }
            ch.setOption(barPairOption(
              '跨条件组均值差 |Δμ| 中位数',
              cross.map(c => c.operator),
              cross.map(c => c.median_gap_before),
              cross.map(c => c.median_gap_after),
              '|Δμ| (L*)'
            ), true);
          }
          if (stabilityTab.value === 'boundary' && chartBoundaryRef.value) {
            const be = stabilityReport.boundary_effect || {};
            const ch = getChart('boundary', chartBoundaryRef.value);
            if (!ch) return;
            ch.setOption({
              title: { text: '边界效应概览', left: 'center', textStyle: { fontSize: 13, fontWeight: 600 } },
              tooltip: { trigger: 'axis' },
              legend: { data: ['调色前', '调色后'], top: 28 },
              grid: { left: 48, right: 16, top: 64, bottom: 40 },
              xAxis: { type: 'category', data: ['距边界中位数', '易翻转区(<2)', 'grade改变', '边界翻转'] },
              yAxis: { type: 'value' },
              series: [
                { name: '调色前', type: 'bar', data: [
                  be.median_dist_before, be.near_boundary_before, be.grade_changed, be.grade_changed_small_move,
                ], itemStyle: { color: '#94a3b8' } },
                { name: '调色后', type: 'bar', data: [
                  be.median_dist_after, be.near_boundary_after, be.grade_changed, be.grade_changed_small_move,
                ], itemStyle: { color: '#3b82f6' } },
              ],
            }, true);
          }
          Object.values(chartInstances).forEach(c => { try { c.resize(); } catch (_) {} });
        });
      }

      async function refreshStabilityStats() {
        const scoped = stabilityScopeRecords();
        if (!scoped.length) {
          Object.keys(stabilityReport).forEach(k => delete stabilityReport[k]);
          Object.assign(stabilityScatterSummary, { n: 0, stdBefore: '—', stdAfter: '—' });
          renderStabilityCharts();
          ElMessage.warning('当前筛选范围内无有效 L* 记录');
          return;
        }
        stabilityLoading.value = true;
        try {
          const body = { min_subgroup_n: stabilityMinN.value };
          if (stabilityOperators.value.length) body.operators = [...stabilityOperators.value];
          if (stabilityGroups.value.length) body.group_names = [...stabilityGroups.value];
          if (stabilitySubgroups.value.length) body.subgroup_names = [...stabilitySubgroups.value];
          const data = await apiFetch('/experiments/stats/stability', { method: 'POST', body });
          Object.keys(stabilityReport).forEach(k => delete stabilityReport[k]);
          Object.assign(stabilityReport, data);
          renderStabilityCharts();
        } catch (e) {
          ElMessage.error('稳定性统计失败：' + e.message);
        } finally {
          stabilityLoading.value = false;
        }
      }

      function openStabilityStats() {
        stabilityDialogVisible.value = true;
      }

      function onStabilityDialogOpened() {
        renderStabilityCharts();
        refreshStabilityStats();
      }

      watch(stabilityDialogVisible, v => { if (!v) disposeStabilityCharts(); });
      watch(statsDialogVisible, v => { if (!v) { try { chartInstances['grade-before']?.dispose(); } catch (_) {} try { chartInstances['grade-after']?.dispose(); } catch (_) {} delete chartInstances['grade-before']; delete chartInstances['grade-after']; } });

      function filterSuggest(list, queryString) {
        const q = (queryString || '').trim().toLowerCase();
        const src = list || [];
        const items = q ? src.filter(v => String(v).toLowerCase().includes(q)) : [...src];
        return items.map(v => ({ value: String(v) }));
      }
      function suggestOperator(q, cb) { cb(filterSuggest(distinct.operator, q)); }
      function suggestCamera(q, cb) { cb(filterSuggest(distinct.camera_device, q)); }
      function suggestLight(q, cb) { cb(filterSuggest(distinct.light_device, q)); }
      function suggestColor(q, cb) { cb(filterSuggest(COLORS, q)); }
      function suggestGrade(q, cb) { cb(filterSuggest(GRADES, q)); }

      function suggestGroupName(q, cb) {
        const src = distinct.group_name || [];
        cb(filterSuggest(src, q));
      }
      function suggestSubgroupName(q, cb) {
        const g = form.group_name?.trim();
        const src = g
          ? allRecords.value.filter(r => r.group_name === g).map(r => r.subgroup_name).filter(Boolean)
          : (distinct.subgroup_name || []);
        cb(filterSuggest([...new Set(src)], q));
      }

      function applySubgroupDefaultsFrom(data) {
        if (!data) return;
        if (data.operator) form.operator = data.operator;
        if (data.camera_device) form.camera_device = data.camera_device;
        if (data.light_device) form.light_device = data.light_device;
        if (data.experiment_date) form.experiment_date = data.experiment_date;
        if (data.illuminance != null) form.illuminance = data.illuminance;
      }

      function applyExperimentContext(ctx) {
        if (!ctx || typeof ctx !== 'object') return;
        skipSubgroupDefaults = true;
        if (ctx.group_name) form.group_name = ctx.group_name;
        if (ctx.subgroup_name) form.subgroup_name = ctx.subgroup_name;
        if (ctx.experiment_date) form.experiment_date = ctx.experiment_date;
        if (ctx.operator) form.operator = ctx.operator;
        if (ctx.camera_device) form.camera_device = ctx.camera_device;
        if (ctx.light_device) form.light_device = ctx.light_device;
        if (ctx.illuminance != null) form.illuminance = ctx.illuminance;
        skipSubgroupDefaults = false;
      }

      function takeImportContext() {
        const raw = sessionStorage.getItem('exp_import_context');
        sessionStorage.removeItem('exp_import_context');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch (_) { return null; }
      }

      async function applySubgroupDefaults() {
        const g = form.group_name?.trim();
        const s = form.subgroup_name?.trim();
        if (!g || !s) return;
        try {
          const data = await apiFetch('/experiments/meta/subgroup-defaults', {
            query: { group_name: g, subgroup_name: s },
          });
          applySubgroupDefaultsFrom(data);
        } catch (_) {}
      }

      function onGroupSubgroupChange() {
        if (skipSubgroupDefaults) return;
        applySubgroupDefaults();
      }

      async function fillSuggestedNames(andSubgroupDefaults) {
        try {
          const q = { date: form.experiment_date || todayStr() };
          if (form.group_name?.trim()) q.group_name = form.group_name.trim();
          if (form.subgroup_name?.trim()) q.subgroup_name = form.subgroup_name.trim();
          const data = await apiFetch('/experiments/meta/suggest-names', { query: q });
          if (!form.group_name?.trim()) form.group_name = data.group_name || '';
          if (andSubgroupDefaults && data.subgroup_defaults) {
            applySubgroupDefaultsFrom(data.subgroup_defaults);
          } else if (andSubgroupDefaults && form.subgroup_name?.trim()) {
            await applySubgroupDefaults();
          }
        } catch (_) {}
      }

      function apiUrl(path, extra) {
        const u = new URL(path, location.origin);
        u.searchParams.set('key', apiKey.value);
        if (extra) Object.entries(extra).forEach(([k,v]) => { if (v != null && v !== '') u.searchParams.set(k, v); });
        return u.toString();
      }
      async function apiFetch(path, opts = {}) {
        const res = await fetch(opts.query ? apiUrl(path, opts.query) : apiUrl(path), {
          method: opts.method || 'GET',
          headers: opts.body ? { 'Content-Type': 'application/json; charset=utf-8' } : {},
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        if (!res.ok) {
          let detail = res.statusText;
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
        }
        return res.status === 204 ? null : res.json();
      }

      async function loadRecords() {
        loading.value = true;
        try {
          const data = await apiFetch('/experiments/records');
          allRecords.value = Array.isArray(data.records) ? data.records : [];
          const pick = f => [...new Set(allRecords.value.map(r => r[f]).filter(Boolean))].sort();
          distinct.operator = pick('operator');
          distinct.camera_device = pick('camera_device');
          distinct.light_device = pick('light_device');
        } catch (e) {
          ElMessage.error('加载失败：' + e.message);
        } finally {
          loading.value = false;
        }
      }
      async function refreshAll() { await loadRecords(); }

      function openDebugUi() { window.open(debugUiUrl.value, '_blank'); }
      function openDebugViewer(runId) {
        window.open('/debug/viewer/' + encodeURIComponent(runId) + '?key=' + encodeURIComponent(apiKey.value), '_blank');
      }
      function openImagePreview(rel) {
        window.open('/debug/img/file?rel=' + encodeURIComponent(rel) + '&key=' + encodeURIComponent(apiKey.value), '_blank');
      }

      function canRecognize(row) {
        if (!row) return false;
        return !!(row.image_rel || row.debug_run_id);
      }

      function paramsFromMetrics(m) {
        const mp = m?.manual_params;
        if (mp && mp.center_x != null) {
          return {
            center_x: mp.center_x,
            center_y: mp.center_y,
            pupil_radius: mp.pupil_radius ?? 5,
            inner_radius: mp.inner_radius ?? Math.max((mp.pupil_radius ?? 5) * 1.2, 8),
            outer_radius: mp.outer_radius ?? Math.max((mp.pupil_radius ?? 5) * 2.5, 16),
          };
        }
        return {
          center_x: m?.pupil_center?.[0] ?? 0,
          center_y: m?.pupil_center?.[1] ?? 0,
          pupil_radius: m?.pupil_radius ?? 5,
          inner_radius: m?.inner_radius ?? Math.max((m?.pupil_radius ?? 5) * 1.2, 8),
          outer_radius: m?.outer_radius ?? Math.max((m?.pupil_radius ?? 5) * 2.5, 16),
        };
      }

      function normalizeRecognizeManualState(canvas) {
        if (!recognizeManualState || !canvas) return;
        const minDim = Math.min(canvas.width || 1, canvas.height || 1);
        recognizeManualState.center_x = Math.max(0, Math.min(canvas.width - 1, recognizeManualState.center_x));
        recognizeManualState.center_y = Math.max(0, Math.min(canvas.height - 1, recognizeManualState.center_y));
        recognizeManualState.pupil_radius = Math.max(2, Math.min(recognizeManualState.pupil_radius, minDim * 0.45));
        recognizeManualState.inner_radius = Math.max(
          recognizeManualState.pupil_radius + 1,
          Math.min(recognizeManualState.inner_radius, minDim * 0.48),
        );
        recognizeManualState.outer_radius = Math.max(
          recognizeManualState.inner_radius + 2,
          Math.min(recognizeManualState.outer_radius, minDim * 0.50),
        );
      }

      function drawRecognizeCanvas() {
        const canvas = recognizeCanvasRef.value;
        if (!recognizeManualState || !recognizeManualImage?.complete || !canvas || !recognizeManualCtx) return;
        recognizeManualCtx.clearRect(0, 0, canvas.width, canvas.height);
        recognizeManualCtx.drawImage(recognizeManualImage, 0, 0);
        const { center_x: cx, center_y: cy, pupil_radius: pr, inner_radius: ir, outer_radius: or } = recognizeManualState;
        recognizeManualCtx.lineWidth = Math.max(2, canvas.width / 240);
        recognizeManualCtx.fillStyle = 'rgba(0, 255, 255, 0.18)';
        recognizeManualCtx.beginPath();
        recognizeManualCtx.arc(cx, cy, or, 0, Math.PI * 2);
        recognizeManualCtx.arc(cx, cy, ir, 0, Math.PI * 2, true);
        recognizeManualCtx.fill();
        recognizeManualCtx.strokeStyle = '#2f81f7';
        recognizeManualCtx.beginPath();
        recognizeManualCtx.arc(cx, cy, pr, 0, Math.PI * 2);
        recognizeManualCtx.stroke();
        recognizeManualCtx.strokeStyle = '#ff4d4f';
        recognizeManualCtx.beginPath();
        recognizeManualCtx.arc(cx, cy, ir, 0, Math.PI * 2);
        recognizeManualCtx.stroke();
        recognizeManualCtx.strokeStyle = '#3fb950';
        recognizeManualCtx.beginPath();
        recognizeManualCtx.arc(cx, cy, or, 0, Math.PI * 2);
        recognizeManualCtx.stroke();
        recognizeManualCtx.strokeStyle = '#ff4d4f';
        recognizeManualCtx.beginPath();
        recognizeManualCtx.moveTo(cx - 8, cy);
        recognizeManualCtx.lineTo(cx + 8, cy);
        recognizeManualCtx.moveTo(cx, cy - 8);
        recognizeManualCtx.lineTo(cx, cy + 8);
        recognizeManualCtx.stroke();
      }

      function recognizeCanvasPoint(event) {
        const canvas = recognizeCanvasRef.value;
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * canvas.width / rect.width,
          y: (event.clientY - rect.top) * canvas.height / rect.height,
        };
      }

      function recognizeHitMode(point) {
        if (!recognizeManualState) return null;
        const canvas = recognizeCanvasRef.value;
        const dx = point.x - recognizeManualState.center_x;
        const dy = point.y - recognizeManualState.center_y;
        const dist = Math.hypot(dx, dy);
        const tol = Math.max(8, (canvas?.width || 480) / 80);
        if (dist < tol) return 'move';
        if (Math.abs(dist - recognizeManualState.pupil_radius) < tol) return 'pupil_radius';
        if (Math.abs(dist - recognizeManualState.inner_radius) < tol) return 'inner_radius';
        if (Math.abs(dist - recognizeManualState.outer_radius) < tol) return 'outer_radius';
        return null;
      }

      function setupRecognizeCanvas(metrics, imageBase64) {
        recognizeManualReady.value = false;
        if (!imageBase64) return;
        recognizeManualState = paramsFromMetrics(metrics);
        recognizeManualImage = new Image();
        recognizeManualImage.onload = async () => {
          await nextTick();
          const canvas = recognizeCanvasRef.value;
          if (!canvas) return;
          canvas.width = recognizeManualImage.naturalWidth;
          canvas.height = recognizeManualImage.naturalHeight;
          recognizeManualCtx = canvas.getContext('2d');
          normalizeRecognizeManualState(canvas);
          drawRecognizeCanvas();
          recognizeManualReady.value = true;
        };
        recognizeManualImage.src = 'data:image/jpeg;base64,' + imageBase64;
      }

      function onRecognizePointerDown(event) {
        if (!recognizeManualState) return;
        recognizeDragMode = recognizeHitMode(recognizeCanvasPoint(event));
        if (recognizeDragMode) {
          event.target.style.cursor = 'grabbing';
          event.target.setPointerCapture(event.pointerId);
        }
      }

      function onRecognizePointerMove(event) {
        const canvas = recognizeCanvasRef.value;
        if (!recognizeManualState || !canvas) return;
        if (!recognizeDragMode) {
          canvas.style.cursor = recognizeHitMode(recognizeCanvasPoint(event)) ? 'grab' : 'default';
          return;
        }
        const point = recognizeCanvasPoint(event);
        if (recognizeDragMode === 'move') {
          recognizeManualState.center_x = point.x;
          recognizeManualState.center_y = point.y;
        } else {
          recognizeManualState[recognizeDragMode] = Math.hypot(
            point.x - recognizeManualState.center_x,
            point.y - recognizeManualState.center_y,
          );
        }
        normalizeRecognizeManualState(canvas);
        drawRecognizeCanvas();
      }

      function onRecognizePointerUp(event) {
        recognizeDragMode = null;
        const canvas = recognizeCanvasRef.value;
        if (canvas) {
          canvas.style.cursor = 'default';
          try { canvas.releasePointerCapture(event.pointerId); } catch (_) {}
        }
      }

      function onRecognizePointerLeave() {
        if (!recognizeDragMode && recognizeCanvasRef.value) {
          recognizeCanvasRef.value.style.cursor = 'default';
        }
      }

      function onRecognizeDialogClosed() {
        recognizeTarget.value = null;
        recognizePreview.value = null;
        recognizeOverlayUrl.value = '';
        recognizeLastManual.value = false;
        recognizeManualReady.value = false;
        recognizeManualState = null;
        recognizeManualImage = null;
        recognizeManualCtx = null;
        recognizeDragMode = null;
      }

      const recognizeDiffRows = computed(() => {
        const p = recognizePreview.value;
        if (!p) return [];
        const cur = p.current_record || {};
        const prop = p.proposed_record || {};
        const rows = [
          { key: 'grade_before', label: '调色前 Grade', current: cur.grade_before || '—', proposed: prop.grade_before || '—' },
          { key: 'lstar_before', label: '调色前 L*', current: fmtLstar(cur.lstar_before), proposed: fmtLstar(prop.lstar_before) },
          { key: 'grade_after', label: '调色后 Grade', current: cur.grade_after || '—', proposed: prop.grade_after || '—' },
          { key: 'lstar_after', label: '调色后 L*', current: fmtLstar(cur.lstar_after), proposed: fmtLstar(prop.lstar_after) },
          { key: 'color', label: '颜色', current: cur.color || '—', proposed: prop.color || '—' },
        ];
        return rows.map(r => ({ ...r, changed: r.current !== r.proposed }));
      });

      async function openRecognizeDialog(row) {
        if (!canRecognize(row)) {
          ElMessage.warning('该记录没有关联原图或 Debug 运行，无法重新识别');
          return;
        }
        recognizeTarget.value = { ...row };
        recognizeSkipQuality.value = !!row.skip_quality;
        recognizeOverwriteRecord.value = true;
        recognizeOverwriteSnapshots.value = true;
        recognizePreview.value = null;
        recognizeOverlayUrl.value = '';
        recognizeDialogVisible.value = true;
        await nextTick();
        await runRecognizePreview(false);
      }

      async function openRecognizeFromForm() {
        if (!editingId.value) {
          ElMessage.warning('请先保存记录后再重新识别');
          return;
        }
        await openRecognizeDialog({
          id: editingId.value,
          image_rel: form.image_rel,
          debug_run_id: form.debug_run_id,
          skip_quality: form.skip_quality,
          grade_before: form.grade_before,
          lstar_before: form.lstar_before,
          grade_after: form.grade_after,
          lstar_after: form.lstar_after,
          color: form.color,
          manual_adjusted: form.manual_adjusted,
        });
      }

      async function runRecognizePreview(useManual) {
        if (!recognizeTarget.value?.id) return;
        recognizeLastManual.value = !!useManual;
        recognizeLoading.value = true;
        try {
          const body = { skip_quality: recognizeSkipQuality.value };
          if (useManual && recognizeManualState) {
            body.manual_params = { ...recognizeManualState };
          }
          const data = await apiFetch('/experiments/records/' + recognizeTarget.value.id + '/recognize', {
            method: 'POST',
            body,
          });
          recognizePreview.value = data;
          const b64 = data.images_base64?.['00_original'];
          const overlay = data.images_base64?.['02_iris_ring'];
          recognizeOverlayUrl.value = overlay ? ('data:image/jpeg;base64,' + overlay) : '';
          setupRecognizeCanvas(data.metrics, b64);
          if (data.proposed_record) {
            recognizeTarget.value = {
              ...recognizeTarget.value,
              ...Object.fromEntries(
                Object.entries(data.current_record || {}).map(([k, v]) => [k, recognizeTarget.value[k] ?? v]),
              ),
            };
          }
        } catch (e) {
          ElMessage.error('识别失败：' + compareErrorLabel(e.message));
        } finally {
          recognizeLoading.value = false;
        }
      }

      async function applyRecognize() {
        if (!recognizeTarget.value?.id || !recognizePreview.value) return;
        if (!recognizeOverwriteRecord.value && !recognizeOverwriteSnapshots.value) {
          ElMessage.warning('请至少选择一项覆盖内容');
          return;
        }
        const changed = recognizeDiffRows.value.some(r => r.changed);
        if (recognizeOverwriteRecord.value && changed) {
          try {
            await ElMessageBox.confirm(
              '新识别结果与当前记录不同，确定覆盖识别数据？',
              '确认覆盖',
              { type: 'warning' },
            );
          } catch (e) {
            if (e === 'cancel' || e === 'close') return;
          }
        }
        recognizeApplying.value = true;
        try {
          const body = {
            overwrite_record: recognizeOverwriteRecord.value,
            overwrite_snapshots: recognizeOverwriteSnapshots.value,
            skip_quality: recognizeSkipQuality.value,
          };
          if (recognizeLastManual.value && recognizeManualState) {
            body.manual_params = { ...recognizeManualState };
          }
          const data = await apiFetch('/experiments/records/' + recognizeTarget.value.id + '/recognize/apply', {
            method: 'POST',
            body,
          });
          const updated = data.record;
          const idx = allRecords.value.findIndex(r => r.id === updated.id);
          if (idx >= 0) {
            allRecords.value[idx] = { ...allRecords.value[idx], ...updated, _compare_audit: null };
          }
          if (editingId.value === updated.id) {
            form.grade_before = updated.grade_before || '';
            form.lstar_before = updated.lstar_before ?? undefined;
            form.grade_after = updated.grade_after || '';
            form.lstar_after = updated.lstar_after ?? undefined;
            form.color = updated.color || '';
            form.skip_quality = !!updated.skip_quality;
            form.manual_adjusted = !!updated.manual_adjusted;
            setEditPreview(updated);
          }
          ElMessage.success('已应用重新识别结果');
          recognizeDialogVisible.value = false;
        } catch (e) {
          ElMessage.error('应用失败：' + compareErrorLabel(e.message));
        } finally {
          recognizeApplying.value = false;
        }
      }

      function canCompare(row) {
        if (!row) return false;
        if (row.image_before_rel && row.image_after_rel) return true;
        if (row.debug_run_id) return true;
        if (row.image_rel) return true;
        return false;
      }

      function recordCompareUrls(row) {
        const key = encodeURIComponent(apiKey.value);
        if (row.image_before_rel && row.image_after_rel && row.id) {
          return {
            before: '/experiments/snapshots/' + row.id + '/before.jpg?key=' + key,
            after: '/experiments/snapshots/' + row.id + '/after.jpg?key=' + key,
          };
        }
        if (row.debug_run_id) {
          const base = '/debug/files/' + row.debug_run_id;
          return {
            before: base + '/08_iris_before.jpg?key=' + key,
            after: base + '/09_iris_after.jpg?key=' + key,
            compare: base + '/07_sclera_before_after.jpg?key=' + key,
          };
        }
        return null;
      }

      async function ensureCompareImages(row) {
        if (row.image_before_rel && row.image_after_rel && row._compare_audit) return row;
        if (!row.id || (!row.image_rel && !row.debug_run_id)) return row;
        compareLoadingId.value = row.id;
        compareLoading.value = true;
        try {
          const data = await apiFetch('/experiments/records/' + row.id + '/ensure-compare-images', { method: 'POST' });
          const idx = allRecords.value.findIndex(r => r.id === row.id);
          const patch = {
            image_before_rel: data.image_before_rel,
            image_after_rel: data.image_after_rel,
            _compare_audit: data.compare_audit || null,
          };
          if (idx >= 0) {
            Object.assign(allRecords.value[idx], patch);
            return allRecords.value[idx];
          }
          Object.assign(row, patch);
          return row;
        } finally {
          compareLoadingId.value = null;
          compareLoading.value = false;
        }
      }

      function compareErrorLabel(code) {
        const map = {
          compare_images_unavailable: '无法生成对比图（识别失败或未检测到有效虹膜）',
          image_not_found: '原图文件不存在，请检查 image_rel 路径',
          invalid_image_rel: '图片路径无效',
          invalid_image_format: '图片文件无法读取',
          no_image_source: '该记录未关联原图或 Debug 运行',
          debug_original_not_found: 'Debug 运行原图不存在',
          invalid_manual_params: '人工环带参数无效',
          manual_params_missing_fields: '人工环带参数不完整',
          manual_params_must_be_numbers: '人工环带参数必须为数字',
          nothing_to_overwrite: '请至少选择一项覆盖内容',
          quality_check_failed: '图片未通过质量检测（模糊/过曝）',
          no_iris_detected: '未检测到虹膜',
          insufficient_iris_samples: '虹膜有效采样像素不足',
          no_valid_pixels_after_highlight_removal: '高光剔除后无有效采样像素',
        };
        return map[code] || code || '未知错误';
      }

      function auditSourceLabel(audit) {
        const map = {
          debug_run: 'Debug 运行复制（与调试台一致）',
          reanalysis: '原图重算（算法相同，当前配置）',
          reanalysis_from_debug_original: 'Debug 原图重算（当前配置）',
          reanalysis_metrics_only: '原图重算审计（图已存在，补写指标）',
        };
        return map[audit?.source] || audit?.source || '—';
      }

      function consistencyLabel(v) {
        if (v === true) return '一致 ✓';
        if (v === false) return '不一致 ✗';
        return '—';
      }

      function fmtLabTriple(lab) {
        if (!lab) return '—';
        return `${lab.L}, ${lab.a}, ${lab.b}`;
      }

      function applyPreviewUrls(payload) {
        importPreview.thumb_url = payload.thumb_url || payload.image_url || '';
        importPreview.before_url = payload.thumb_before_url || '';
        importPreview.after_url = payload.thumb_after_url || '';
        importPreview.compare_url = payload.compare_url || '';
        importPreview.summary = payload.summary || '';
      }

      async function openCompareDialog(row) {
        if (!canCompare(row)) {
          ElMessage.warning('该记录没有关联图片，无法对比');
          return;
        }
        let target = row;
        try {
          if (row.id && !(row.image_before_rel && row.image_after_rel && row._compare_audit)) {
            ElMessage.info('正在生成/加载调色对比…');
            target = await ensureCompareImages(row);
          } else if (row.id && row.image_before_rel && !row._compare_audit) {
            target = await ensureCompareImages(row);
          }
        } catch (e) {
          ElMessage.error('生成对比图失败：' + compareErrorLabel(e.message));
          return;
        }
        const urls = recordCompareUrls(target);
        compareDialog.before_url = urls?.before || '';
        compareDialog.after_url = urls?.after || '';
        compareDialog.compare_url = urls?.compare || '';
        compareDialog.grade_before = target.grade_before || '';
        compareDialog.grade_after = target.grade_after || '';
        compareDialog.lstar_before = target.lstar_before;
        compareDialog.lstar_after = target.lstar_after;
        compareDialog.image_rel = target.image_rel || '';
        compareDialog.audit = target._compare_audit || null;
        compareDialogVisible.value = true;
        if (editingId.value === target.id) setEditPreview(target);
      }

      async function openCompareFromForm() {
        await openCompareDialog({
          id: editingId.value,
          image_rel: form.image_rel,
          debug_run_id: form.debug_run_id,
          image_before_rel: null,
          image_after_rel: null,
          grade_before: form.grade_before,
          grade_after: form.grade_after,
          lstar_before: form.lstar_before,
          lstar_after: form.lstar_after,
        });
      }

      function openCompareDialogFromPreview() {
        compareDialog.before_url = importPreview.before_url || '';
        compareDialog.after_url = importPreview.after_url || '';
        compareDialog.compare_url = importPreview.compare_url || '';
        compareDialog.grade_before = form.grade_before || '';
        compareDialog.grade_after = form.grade_after || '';
        compareDialog.lstar_before = form.lstar_before;
        compareDialog.lstar_after = form.lstar_after;
        compareDialog.image_rel = form.image_rel || '';
        compareDialogVisible.value = true;
      }

      function onPreviewCompareError() {
        if (importPreview.compare_url) {
          importPreview.before_url = '';
          importPreview.after_url = '';
        }
      }

      function onDialogCompareError() {
        if (compareDialog.compare_url) {
          compareDialog.before_url = '';
          compareDialog.after_url = '';
        }
      }

      async function loadDebugRuns() {
        importLoading.value = true;
        try {
          const data = await apiFetch('/experiments/debug/runs', { query: { limit: 30 } });
          debugRuns.value = data.runs || [];
        } catch (e) {
          ElMessage.error('加载 Debug 列表失败：' + e.message);
        } finally {
          importLoading.value = false;
        }
      }

      async function openImportDialog() {
        importDialogVisible.value = true;
        await loadDebugRuns();
      }

      function applyImportPayload(payload) {
        if (!payload) return;
        form.grade_before = payload.grade_before || '';
        form.lstar_before = payload.lstar_before ?? undefined;
        form.grade_after = payload.grade_after || '';
        form.lstar_after = payload.lstar_after ?? undefined;
        form.color = payload.color || '';
        form.image_rel = payload.image_rel || '';
        form.debug_run_id = payload.debug_run_id || '';
        form.skip_quality = !!payload.skip_quality;
        form.manual_adjusted = !!payload.manual_adjusted;
        applyPreviewUrls(payload);
        const noteLine = payload.summary || '';
        const tag = payload.debug_run_id || (payload.image_rel ? 'session' : '');
        if (noteLine && tag && !String(form.notes || '').includes(tag)) {
          form.notes = noteLine + (form.notes ? '\n' + form.notes : '');
        }
      }

      async function openImportDrawer(payload, experimentContext) {
        editingId.value = null;
        Object.assign(form, emptyForm());
        const ctx = experimentContext || takeImportContext();
        if (ctx) applyExperimentContext(ctx);
        else await fillSuggestedNames(true);
        applyImportPayload(payload);
        importDialogVisible.value = false;
        drawerVisible.value = true;
        ElMessage.success(ctx ? '已导入识别数据与 Debug 组别' : '已导入识别数据，请确认实验组等信息');
      }

      async function importFromRun(runId) {
        try {
          const payload = await apiFetch('/experiments/debug/runs/' + encodeURIComponent(runId) + '/import');
          await openImportDrawer(payload);
        } catch (e) {
          ElMessage.error('导入失败：' + e.message);
        }
      }

      async function importDraftPayload(draft) {
        if (!draft || !draft.metrics) {
          throw new Error('缺少识别 metrics 数据');
        }
        const payload = await apiFetch('/experiments/import/from-metrics', { method: 'POST', body: draft });
        await openImportDrawer(payload, draft.experiment_context || null);
      }

      async function tryImportFromUrl() {
        if (params.get('import_draft')) {
          const raw = sessionStorage.getItem('exp_import_draft');
          sessionStorage.removeItem('exp_import_draft');
          if (raw) {
            try {
              await importDraftPayload(JSON.parse(raw));
            } catch (e) {
              ElMessage.error('导入当前识别结果失败：' + e.message);
            }
          }
          return;
        }
        const runId = params.get('import_run');
        if (!runId) return;
        await importFromRun(runId);
      }

      async function handleDebugImportMessage(msg) {
        if (!msg || msg.type !== 'debug_import') return;
        try {
          if (msg.import_draft) {
            let draft = msg.draft || null;
            if (!draft) {
              const raw = sessionStorage.getItem('exp_import_draft');
              sessionStorage.removeItem('exp_import_draft');
              if (raw) draft = JSON.parse(raw);
            } else {
              sessionStorage.removeItem('exp_import_draft');
            }
            if (!draft) return;
            await importDraftPayload(draft);
            return;
          }
          if (msg.import_run) {
            await importFromRun(msg.import_run);
          }
        } catch (e) {
          ElMessage.error('导入失败：' + e.message);
        }
      }

      function setupDebugImportListener() {
        try {
          const channel = new BroadcastChannel('iris-experiment-import');
          channel.onmessage = (event) => { handleDebugImportMessage(event.data || {}); };
        } catch (_) {}
      }

      async function suggestNames() {
        try {
          const q = { date: form.experiment_date || todayStr() };
          if (form.group_name?.trim()) q.group_name = form.group_name.trim();
          if (form.subgroup_name?.trim()) q.subgroup_name = form.subgroup_name.trim();
          const data = await apiFetch('/experiments/meta/suggest-names', { query: q });
          form.group_name = data.group_name || form.group_name;
          if (!form.subgroup_name?.trim()) form.subgroup_name = data.subgroup_name || '';
          if (data.subgroup_defaults) applySubgroupDefaultsFrom(data.subgroup_defaults);
          else await applySubgroupDefaults();
          ElMessage.success('已填入建议编号');
        } catch (e) { ElMessage.error(e.message); }
      }

      async function openCreate() {
        editingId.value = null;
        Object.assign(form, emptyForm());
        importPreview.thumb_url = '';
        importPreview.before_url = '';
        importPreview.after_url = '';
        importPreview.compare_url = '';
        importPreview.summary = '';
        drawerVisible.value = true;
        await fillSuggestedNames(true);
      }

      function setEditPreview(row) {
        const key = encodeURIComponent(apiKey.value);
        if (row.image_before_rel && row.image_after_rel) {
          importPreview.before_url = '/experiments/snapshots/' + row.id + '/before.jpg?key=' + key;
          importPreview.after_url = '/experiments/snapshots/' + row.id + '/after.jpg?key=' + key;
          importPreview.compare_url = '';
          importPreview.thumb_url = row.image_rel
            ? '/debug/img/file?rel=' + encodeURIComponent(row.image_rel) + '&key=' + key
            : importPreview.before_url;
        } else if (row.debug_run_id) {
          const base = '/debug/files/' + row.debug_run_id;
          importPreview.before_url = base + '/08_iris_before.jpg?key=' + key;
          importPreview.after_url = base + '/09_iris_after.jpg?key=' + key;
          importPreview.compare_url = base + '/07_sclera_before_after.jpg?key=' + key;
          importPreview.thumb_url = base + '/00_original.jpg?key=' + key;
        } else {
          importPreview.before_url = '';
          importPreview.after_url = '';
          importPreview.compare_url = '';
          importPreview.thumb_url = row.image_rel
            ? '/debug/img/file?rel=' + encodeURIComponent(row.image_rel) + '&key=' + key
            : '';
        }
        importPreview.summary = row.image_rel ? ('img:' + row.image_rel) : '';
      }

      function openEdit(row) {
        skipSubgroupDefaults = true;
        editingId.value = row.id;
        Object.assign(form, {
          group_name: row.group_name||'', subgroup_name: row.subgroup_name||'', experiment_date: row.experiment_date||todayStr(),
          operator: row.operator||'', camera_device: row.camera_device||'', light_device: row.light_device||'',
          illuminance: row.illuminance??undefined, color: row.color||'',
          grade_before: row.grade_before||'', lstar_before: row.lstar_before??undefined,
          grade_after: row.grade_after||'', lstar_after: row.lstar_after??undefined,
          skip_quality: !!row.skip_quality, manual_adjusted: !!row.manual_adjusted,
          include_in_stats: row.include_in_stats !== false,
          notes: row.notes||'',
          image_rel: row.image_rel||'', debug_run_id: row.debug_run_id||'',
        });
        setEditPreview(row);
        drawerVisible.value = true;
        skipSubgroupDefaults = false;
      }

      async function saveForm() {
        try { await formRef.value.validate(); } catch (_) { return; }
        saving.value = true;
        const payload = { ...form };
        if (!payload.subgroup_name) payload.subgroup_name = null;
        else payload.subgroup_name = String(payload.subgroup_name).trim();
        ['illuminance','lstar_before','lstar_after'].forEach(k => { if (payload[k] === undefined) payload[k] = null; });
        payload.skip_quality = !!payload.skip_quality;
        payload.manual_adjusted = !!payload.manual_adjusted;
        payload.include_in_stats = !!payload.include_in_stats;
        try {
          const isEdit = !!editingId.value;
          if (isEdit) {
            await apiFetch('/experiments/records/' + editingId.value, { method:'PUT', body: payload });
            ElMessage.success('已更新');
          } else {
            await apiFetch('/experiments/records', { method:'POST', body: payload });
            ElMessage.success('已创建');
            try {
              new BroadcastChannel('iris-experiment-sync').postMessage({
                type: 'record_saved',
                group_name: payload.group_name,
                subgroup_name: payload.subgroup_name,
              });
            } catch (_) {}
          }
          drawerVisible.value = false;
          Object.assign(form, emptyForm());
          importPreview.thumb_url = '';
          importPreview.before_url = '';
          importPreview.after_url = '';
          importPreview.compare_url = '';
          importPreview.summary = '';
          await loadRecords();
          if (!isEdit) resetAllFilters();
        } catch (e) { ElMessage.error('保存失败：' + e.message); }
        finally { saving.value = false; }
      }

      async function toggleIncludeInStats(row, include) {
        const prev = row.include_in_stats !== false;
        if (prev === include) return;
        includeStatsSavingId.value = row.id;
        row.include_in_stats = include;
        try {
          const updated = await apiFetch('/experiments/records/' + row.id + '/include-in-stats', {
            method: 'PATCH',
            body: { include_in_stats: include },
          });
          const idx = allRecords.value.findIndex(r => r.id === row.id);
          if (idx >= 0) {
            allRecords.value[idx].include_in_stats = updated.include_in_stats !== false;
          }
          if (editingId.value === row.id) {
            form.include_in_stats = include;
          }
        } catch (e) {
          row.include_in_stats = prev;
          ElMessage.error('更新纳入统计失败：' + e.message);
        } finally {
          includeStatsSavingId.value = null;
        }
      }

      async function deleteOne(row) {
        try {
          await ElMessageBox.confirm('确定删除记录 #' + row.id + '？', '确认', { type:'warning' });
          await apiFetch('/experiments/records/' + row.id, { method:'DELETE' });
          ElMessage.success('已删除');
          await loadRecords();
        } catch (e) { if (e !== 'cancel' && e !== 'close') ElMessage.error(e.message||e); }
      }

      async function bulkDelete() {
        if (!selectedIds.value.length) return;
        try {
          await ElMessageBox.confirm('确定删除 ' + selectedIds.value.length + ' 条？', '批量删除', { type:'warning' });
          await apiFetch('/experiments/records/bulk-delete', { method:'POST', body:{ ids: selectedIds.value } });
          ElMessage.success('已删除');
          selectedIds.value = [];
          tableRef.value?.clearSelection?.();
          await loadRecords();
        } catch (e) { if (e !== 'cancel' && e !== 'close') ElMessage.error(e.message||e); }
      }

      function onSelectionChange(rows) { selectedIds.value = rows.map(r => r.id); }
      function fmtLstar(v) { return v == null || v === '' ? '—' : Number(v).toFixed(2); }
      function fmtBool(v) { return v ? '是' : '否'; }

      watch(globalSearch, () => { displayLimit.value = pageSize.value; });

      onBeforeUnmount(() => disposeStabilityCharts());

      onMounted(async () => {
        setupDebugImportListener();
        await refreshAll();
        await tryImportFromUrl();
      });

      return {
        libsReady, apiKey, allRecords, loading, saving, selectedIds, drawerVisible, drawerTitle,
        form, formRef, tableRef, formRules, distinct, globalSearch, columnFilters, sortState,
        pageSize, displayLimit, filteredRecords, pagedRecords, canLoadMore, hasActiveFilters, hasActiveSort,
        gradeOptions, colorOptions, boolOptions, blueColors, greenColors, brownColors,
        importDialogVisible, importLoading, debugRuns, importPreview, debugUiUrl,
        compareDialogVisible, compareDialog, compareLoading, compareLoadingId, formRowForCompare,
        statsDialogVisible, statsMainTab, statsGroupBy, statsRows, statsTotals, statDimOptions, activeStatDims,
        statsPctOperators, statsPctGroups, statsPctSubgroups, statsPctByOperator, statsPctRows, statsPctTotals,
        statsPctOperatorOptions, statsPctGroupOptions, statsPctSubgroupOptions,
        chartGradeBeforeRef, chartGradeAfterRef, formatGradePctOnly, gradePct,
        refreshGradePctStats, onStatsPctGroupChange, onStatsTabChange, onStatsDialogOpened,
        stabilityDialogVisible, stabilityLoading, stabilityMinN,
        stabilityOperators, stabilityGroups, stabilitySubgroups, stabilityTab, stabilityReport,
        stabilityScatterSummary, stabilityOperatorOptions, stabilityGroupOptions, stabilitySubgroupOptions,
        chartScatterRef, chartWithinRef, chartPersonRef, chartCrossRef, chartBoundaryRef,
        openStabilityStats, refreshStabilityStats, renderStabilityCharts, onStabilityDialogOpened, onStabilityGroupChange,
        refreshAll, openCreate, openEdit, saveForm, deleteOne, bulkDelete, suggestNames,
        openGradeStats, refreshGradeStats, gradeShort, gradeCountSum, formatStatDim,
        suggestOperator, suggestCamera, suggestLight, suggestColor, suggestGrade,
        suggestGroupName, suggestSubgroupName, onGroupSubgroupChange,
        onSelectionChange, fmtLstar, fmtBool, toggleIncludeInStats, includeStatsSavingId, onHeaderSort, onHeaderFilter,
        resetAllFilters, loadMore, onPageSizeChange,
        openImportDialog, importFromRun, openDebugUi, openDebugViewer, openImagePreview,
        canCompare, canRecognize, openCompareDialog, openCompareFromForm, openCompareDialogFromPreview, onPreviewCompareError, onDialogCompareError,
        recognizeDialogVisible, recognizeLoading, recognizeApplying, recognizeTarget, recognizePreview,
        recognizeSkipQuality, recognizeOverwriteRecord, recognizeOverwriteSnapshots, recognizeCanvasRef,
        recognizeOverlayUrl, recognizeManualReady, recognizeDiffRows, openRecognizeDialog, openRecognizeFromForm,
        runRecognizePreview, applyRecognize, onRecognizePointerDown, onRecognizePointerMove,
        onRecognizePointerUp, onRecognizePointerLeave, onRecognizeDialogClosed,
        auditSourceLabel, consistencyLabel, fmtLabTriple, compareErrorLabel,
      };
    },
  });

  app.use(ElementPlus, typeof ElementPlusLocaleZhCn !== 'undefined' ? { locale: ElementPlusLocaleZhCn } : {});
  app.mount('#app');
})();
</script>
</body>
</html>
